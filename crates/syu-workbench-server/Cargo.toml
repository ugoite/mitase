[package]
name = "syu-workbench-server"
version = "0.0.1-alpha.0"
edition = "2024"
rust-version = "1.88"
description = "Axum server for the syu Workbench API"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
futures-util = "0.3.31"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syu-code-intel = { path = "../syu-code-intel" }
syu-core = { path = "../syu-core" }
syu-domain = { path = "../syu-domain" }
syu-task-model = { path = "../syu-task-model" }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
