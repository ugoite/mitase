[package]
name = "mitase-workbench-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
mitase-diagnostics = { path = "../mitase-diagnostics" }
mitase-agent = { path = "../mitase-agent" }
mitase-delivery = { path = "../mitase-delivery" }
mitase-planner = { path = "../mitase-planner" }
mitase-project-model = { path = "../mitase-project-model" }
mitase-spec-model = { path = "../mitase-spec-model" }
mitase-validation = { path = "../mitase-validation" }
mitase-work-model = { path = "../mitase-work-model" }
mitase-workspace = { path = "../mitase-workspace" }
tokio = { version = "1.52.3", features = ["io-util", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
http-body-util = "0.1.3"
http = "1.3.1"
tower = { version = "0.5.2", features = ["util"] }
tempfile.workspace = true
