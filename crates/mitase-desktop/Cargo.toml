[package]
name = "mitase-desktop"
version = "0.0.1-alpha.0"
edition = "2024"
rust-version = "1.88"
description = "Tauri shell for the shared mitase Workbench"
license = "MIT"

[features]
default = []
tauri-runtime = ["dep:tauri", "dep:url"]

[dependencies]
anyhow = "1.0.100"
dioxus = { version = "0.7.9", features = ["asset", "html", "macro"] }
dioxus-ssr = "0.7.9"
serde = { version = "1.0.228", features = ["derive"] }
mitase-app-ui = { path = "../mitase-app-ui" }
mitase-workbench = { path = "../mitase-workbench" }
mitase-workbench-server = { path = "../mitase-workbench-server" }
tokio = { version = "1.52.3", features = ["net", "rt-multi-thread"] }
tauri = { version = "2", optional = true }
url = { version = "2.5.7", optional = true }

[build-dependencies]
tauri-build = "2"
