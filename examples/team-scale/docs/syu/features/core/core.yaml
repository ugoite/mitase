schema: syu/spec/v1
kind: features
namespace: team-scale
category: Team-scale example
features:
- id: FEAT-TEAMSCALE-001
  title: Team-scale delivery surface
  summary: Show a larger example with several owned Rust implementation and verification
    files.
  status: implemented
  bindings:
  - id: implementation
    role: implementation
    facet: delivery
    responsibility: Implement the owned behavior for this example workspace.
    targets:
    - id: target-1
      adapter: rust
      path: src/auth/login.rs
      selector:
        kind: file
    - id: target-2
      adapter: rust
      path: src/auth/session.rs
      selector:
        kind: file
    - id: target-3
      adapter: rust
      path: src/operations/audit.rs
      selector:
        kind: file
    - id: target-4
      adapter: rust
      path: src/operations/reporting.rs
      selector:
        kind: file
    satisfies:
    - REQ-TEAMSCALE-001#criterion.owned-delivery
