schema: syu/spec/v1
kind: requirements
namespace: go-only
category: Go example
requirements:
- id: REQ-GOONLY-001
  title: Go starter behavior
  description: The Go sample exposes one implementation file and one test file.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: The Go sample exposes one implementation file and one test file.
    governed_by:
    - POL-GOONLY-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: shell
      path: go/app_test.go
      selector:
        kind: marker
        value: "func TestGoRequirement(t *testing.T) {"
      claims:
      - kind: verifies
        criterion: REQ-GOONLY-001#criterion.owned-delivery
        covers:
        - FEAT-GOONLY-001#binding.implementation/target.target-1
        runner:
          runner: cargo-test
