schema: syu/spec/v1
kind: policies
namespace: go-only
category: Go example
policies:
- id: POL-GOONLY-001
  title: Go example governance
  summary: Go delivery stays traceable through explicit implementation and verification
    files.
  description: Keep a Go-first example aligned with the v1 ownership model.
  rules:
  - id: traceable-delivery
    level: must
    statement: Go delivery stays traceable through explicit implementation and verification
      files.
    governed_by:
    - PHIL-GOONLY-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: shell
      path: go/app.go
      selector:
        kind: marker
        value: "func GoFeatureImpl() string {"
      claims:
      - kind: enforces
        rule: POL-GOONLY-001#rule.traceable-delivery
