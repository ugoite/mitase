schema: mitase/spec/v1
kind: policies
namespace: generic
category: Generic example
policies:
- id: POL-GENERIC-001
  title: Generic example governance
  summary: Even the smallest example uses explicit implementation and verification
    bindings.
  description: Keep the smallest starter workspace compatible with the v1 graph.
  rules:
  - id: traceable-delivery
    level: must
    statement: Even the smallest example uses explicit implementation and verification
      bindings.
    governed_by:
    - PHIL-GENERIC-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: shell
      path: scripts/bootstrap-generic.sh
      selector:
        kind: marker
        value: "#!/usr/bin/env bash"
      claims:
      - kind: enforces
        rule: POL-GENERIC-001#rule.traceable-delivery
