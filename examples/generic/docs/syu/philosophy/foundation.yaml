category: Philosophy
version: 1
language: en

philosophies:
  - id: PHIL-001
    title: generic should turn intent into executable agreements
    product_design_principle: |
      The project should keep philosophy, policy, requirements, and features
      explicit enough that contributors can validate changes mechanically.
    coding_guideline: |
      Prefer stable IDs, typed data, and explicit traceability over conventions
      that live only in contributor memory.
    linked_policies:
      - POL-001
