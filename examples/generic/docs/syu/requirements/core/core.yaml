schema: syu/spec/v1
kind: requirements
namespace: generic
category: Generic example
requirements:
- id: REQ-GENERIC-001
  title: Generic bootstrap flow
  description: Bootstrap guidance stays connected to one implementation script and
    one review artifact.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: Bootstrap guidance stays connected to one implementation script and
      one review artifact.
    governed_by:
    - POL-GENERIC-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: shell
      path: scripts/bootstrap-generic.sh
      selector:
        kind: marker
        value: "#!/usr/bin/env bash"
      claims:
      - kind: verifies
        criterion: REQ-GENERIC-001#criterion.owned-delivery
        covers:
        - FEAT-GENERIC-001#binding.implementation/target.target-1
        runner:
          runner: cargo-test
