schema: syu/spec/v1
kind: features
namespace: polyglot
category: Polyglot example
features:
- id: FEAT-POLYGLOT-001
  title: Cross-language starter behavior
  summary: Show one requirement spanning Rust, Python, and TypeScript artifacts.
  status: implemented
  bindings:
  - id: implementation
    role: implementation
    facet: delivery
    responsibility: Implement the owned behavior for this example workspace.
    targets:
    - id: target-1
      adapter: shell
      path: frontend/feature.ts
      selector:
        kind: marker
        value: "export function typescriptFeature() {"
      claims:
      - kind: satisfies
        criterion: REQ-POLYGLOT-001#criterion.owned-delivery
    - id: target-2
      adapter: shell
      path: python/app.py
      selector:
        kind: marker
        value: "def python_feature_impl():"
    - id: target-3
      adapter: shell
      path: src/trace.rs
      selector:
        kind: marker
        value: "pub fn mixed_rust_requirement() {}"
