schema: syu/spec/v1
kind: features
namespace: polyglot
category: Polyglot example
features:
- id: FEAT-POLYGLOT-001
  title: Cross-language starter behavior
  summary: Show one requirement spanning Rust, Python, and TypeScript artifacts.
  status: implemented
  bindings:
  - id: implementation
    role: implementation
    facet: delivery
    responsibility: Implement the owned behavior for this example workspace.
    targets:
    - id: target-1
      adapter: typescript
      path: frontend/feature.ts
      selector:
        kind: file
    - id: target-2
      adapter: python
      path: python/app.py
      selector:
        kind: file
    - id: target-3
      adapter: rust
      path: src/trace.rs
      selector:
        kind: file
    satisfies:
    - REQ-POLYGLOT-001#criterion.owned-delivery
