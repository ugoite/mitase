schema: mitase/spec/v1
kind: policies
namespace: polyglot
category: Polyglot example
policies:
- id: POL-POLYGLOT-001
  title: Polyglot example governance
  summary: Polyglot delivery must preserve exact ownership across every participating
    language.
  description: Show one requirement spanning Rust, Python, and TypeScript artifacts.
  rules:
  - id: traceable-delivery
    level: must
    statement: Polyglot delivery must preserve exact ownership across every participating
      language.
    governed_by:
    - PHIL-POLYGLOT-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: shell
      path: frontend/feature.ts
      selector:
        kind: marker
        value: "export function typescriptFeature() {"
      claims:
      - kind: enforces
        rule: POL-POLYGLOT-001#rule.traceable-delivery
