schema: mitase/spec/v1
kind: requirements
namespace: polyglot
category: Polyglot example
requirements:
- id: REQ-POLYGLOT-001
  title: Cross-language starter behavior
  description: The polyglot sample keeps coordinated implementation and verification
    files across languages.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: The polyglot sample keeps coordinated implementation and verification
      files across languages.
    governed_by:
    - POL-POLYGLOT-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: typescript
      path: frontend/traceability.test.ts
      selector: { kind: file }
      claims:
      - kind: verifies
        criterion: REQ-POLYGLOT-001#criterion.owned-delivery
        covers:
        - FEAT-POLYGLOT-001#binding.implementation/target.target-1
        runner:
          runner: node-test
          arguments:
            path: frontend/traceability.test.ts
            name: typescriptRequirementTest
            test: frontend/traceability.test.ts::typescriptRequirementTest
    - id: target-2
      adapter: python
      path: python/test_traceability.py
      selector: { kind: file }
      claims:
      - kind: verifies
        criterion: REQ-POLYGLOT-001#criterion.owned-delivery
        covers:
        - FEAT-POLYGLOT-001#binding.implementation/target.target-2
        runner:
          runner: pytest
          arguments: { test: python/test_traceability.py::test_python_requirement }
