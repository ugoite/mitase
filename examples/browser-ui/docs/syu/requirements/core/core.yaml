schema: syu/spec/v1
kind: requirements
namespace: browser-ui
category: Browser UI example
requirements:
- id: REQ-BROWSERUI-001
  title: Counter component delivery
  description: A counter component remains owned by one feature and one verification
    path.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: A counter component remains owned by one feature and one verification
      path.
    governed_by:
    - POL-BROWSERUI-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: shell
      path: src/components/Counter.test.tsx
      selector:
        kind: marker
        value: "export function test_counter_increments() {"
      claims:
      - kind: verifies
        criterion: REQ-BROWSERUI-001#criterion.owned-delivery
        covers:
        - FEAT-BROWSERUI-001#binding.implementation/target.target-1
        runner:
          runner: cargo-test
