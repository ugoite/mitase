schema: mitase/spec/v1
kind: features
namespace: ruby-only
category: Ruby example
features:
- id: FEAT-RUBYONLY-001
  title: Ruby starter behavior
  summary: Keep a Ruby-first example represented in the v1 graph with file-level ownership.
  status: implemented
  bindings:
  - id: implementation
    role: implementation
    facet: delivery
    responsibility: Implement the owned behavior for this example workspace.
    targets:
    - id: target-1
      adapter: shell
      path: lib/order_summary.rb
      selector:
        kind: marker
        value: "class OrderSummary"
      claims:
      - kind: satisfies
        criterion: REQ-RUBYONLY-001#criterion.owned-delivery
