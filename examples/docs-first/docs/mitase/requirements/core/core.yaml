schema: mitase/spec/v1
kind: requirements
namespace: docs-first
category: Docs-first example
requirements:
- id: REQ-DOCSFIRST-001
  title: Documentation publishing flow
  description: Publishing docs keeps one implementation path and one review path.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: Publishing docs keeps one implementation path and one review path.
    governed_by:
    - POL-DOCSFIRST-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: shell
      path: scripts/publish-docs.sh
      selector:
        kind: marker
        value: "#!/usr/bin/env bash"
      claims:
      - kind: verifies
        criterion: REQ-DOCSFIRST-001#criterion.owned-delivery
        covers:
        - FEAT-DOCSFIRST-001#binding.implementation/target.target-1
        runner:
          runner: cargo-test
    - id: target-2
      adapter: shell
      path: config/navigation.yaml
      selector:
        kind: marker
        value: "sections:"
