schema: syu/spec/v1
kind: policies
namespace: docs-first
category: Docs-first example
policies:
- id: POL-DOCSFIRST-001
  title: Docs-first example governance
  summary: Documentation-first work still needs exact file ownership and verification
    evidence.
  description: Keep documentation-led delivery traceable with markdown, shell, and
    YAML artifacts.
  rules:
  - id: traceable-delivery
    level: must
    statement: Documentation-first work still needs exact file ownership and verification
      evidence.
    governed_by:
    - PHIL-DOCSFIRST-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: shell
      path: scripts/publish-docs.sh
      selector:
        kind: file
    enforces:
    - POL-DOCSFIRST-001#rule.traceable-delivery
