schema: syu/spec/v1
kind: policies
namespace: csharp-fallback
category: C# fallback example
policies:
- id: POL-CSHARPFALLBACK-001
  title: C# fallback example governance
  summary: Fallback ownership still needs explicit source, verification, and automation
    targets.
  description: Show file-level ownership for a language without symbol-level parsing
    in the active v1 toolchain.
  rules:
  - id: traceable-delivery
    level: must
    statement: Fallback ownership still needs explicit source, verification, and automation
      targets.
    governed_by:
    - PHIL-CSHARPFALLBACK-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: csharp
      path: src/OrderSummary.cs
      selector:
        kind: file
    enforces:
    - POL-CSHARPFALLBACK-001#rule.traceable-delivery
