schema: syu/spec/v1
kind: requirements
namespace: csharp-fallback
category: C# fallback example
requirements:
- id: REQ-CSHARPFALLBACK-001
  title: Fallback file ownership
  description: The C# sample remains reviewable through file-level bindings and a
    shell check.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: The C# sample remains reviewable through file-level bindings and a
      shell check.
    governed_by:
    - POL-CSHARPFALLBACK-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: csharp
      path: tests/OrderSummaryTests.cs
      selector:
        kind: file
    verifies:
    - REQ-CSHARPFALLBACK-001#criterion.owned-delivery
