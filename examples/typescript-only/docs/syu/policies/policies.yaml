schema: syu/spec/v1
kind: policies
namespace: typescript-only
category: TypeScript example
policies:
- id: POL-TYPESCRIPTONLY-001
  title: TypeScript example governance
  summary: TypeScript delivery stays traceable through exact implementation and verification
    bindings.
  description: Keep a TypeScript-first example aligned with the v1 graph.
  rules:
  - id: traceable-delivery
    level: must
    statement: TypeScript delivery stays traceable through exact implementation and
      verification bindings.
    governed_by:
    - PHIL-TYPESCRIPTONLY-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: typescript
      path: src/app.ts
      selector:
        kind: file
    enforces:
    - POL-TYPESCRIPTONLY-001#rule.traceable-delivery
