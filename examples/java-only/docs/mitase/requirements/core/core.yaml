schema: mitase/spec/v1
kind: requirements
namespace: java-only
category: Java example
requirements:
- id: REQ-JAVAONLY-001
  title: Java starter behavior
  description: The Java sample keeps source and test ownership visible in review.
  priority: high
  status: implemented
  criteria:
  - id: owned-delivery
    kind: behavior
    statement: The Java sample keeps source and test ownership visible in review.
    governed_by:
    - POL-JAVAONLY-001#rule.traceable-delivery
  bindings:
  - id: verification
    role: verification
    facet: verification
    responsibility: Verify the owned example behavior through checked-in evidence.
    targets:
    - id: target-1
      adapter: shell
      path: src/test/java/example/app/OrderSummaryTest.java
      selector:
        kind: marker
        value: "class OrderSummaryTest {"
      claims:
      - kind: verifies
        criterion: REQ-JAVAONLY-001#criterion.owned-delivery
        covers:
        - FEAT-JAVAONLY-001#binding.implementation/target.target-1
        runner:
          runner: cargo-test
