schema: syu/spec/v1
kind: policies
namespace: java-only
category: Java example
policies:
- id: POL-JAVAONLY-001
  title: Java example governance
  summary: Java example files must still have explicit implementation and verification
    bindings.
  description: Keep a Java-first example represented in the v1 graph with file-level
    ownership.
  rules:
  - id: traceable-delivery
    level: must
    statement: Java example files must still have explicit implementation and verification
      bindings.
    governed_by:
    - PHIL-JAVAONLY-001#principle.exact-ownership
    applies_to:
      roles:
      - implementation
      - verification
      - documentation
  bindings:
  - id: enforcement
    role: enforcement
    facet: delivery
    responsibility: Keep the example rule connected to an active owned artifact.
    targets:
    - id: policy-target
      adapter: java
      path: src/main/java/example/app/OrderSummary.java
      selector:
        kind: file
    enforces:
    - POL-JAVAONLY-001#rule.traceable-delivery
