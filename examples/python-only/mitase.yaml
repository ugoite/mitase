schema: mitase/config/v1
workspace:
  spec_roots: [docs/mitase]
  excludes: [target/**, node_modules/**, docs/generated/**]
inventory:
  active_profile: default
  profiles:
    - id: default
      providers: { python: {}, documentation: {}, declared: {}, shell: {} }
validation:
  preset: standard
  readiness:
    target: seedable
    limits: { max_ownership_scope_units: 64 }
  changed:
    require_owned_changes: false
verification: { runners: {} }
