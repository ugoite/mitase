schema: mitase/config/v1
workspace:
  spec_roots: [spec]
  excludes: []
inventory:
  active_profile: default
  profiles: [{ id: default, providers: { rust: { mode: test, include_tests: true }, typescript: {}, openapi: { roots: [openapi.yaml] } } }]
validation:
  preset: agent-ready
  readiness:
    target: closed-loop
    limits: { max_ownership_scope_units: 64 }
  changed:
    baseline:
      strategy: merge-base
      against: origin/main
    require_owned_changes: true
verification:
  runners:
    cargo-test:
      executable: cargo
      arguments: [test, -p, "{package}", "{test}"]
