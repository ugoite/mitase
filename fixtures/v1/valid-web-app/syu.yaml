schema: syu/config/v1
workspace:
  spec_roots: [spec]
  source_roots: [web, api, tests]
  ignore: []
profiles:
  active: [web-app]
  custom:
    web-app:
      facets:
        ui: { include: [web/**] }
        backend: { include: [api/**] }
        api: { include: [openapi.yaml] }
        verification: { include: [tests/**] }
      contract_rules:
        - kind: http
          require_participants:
            - { role: provider, facets: [backend], min: 1 }
            - { role: consumer, facets: [ui], min: 1 }
validation:
  preset: agent-ready
  deny_warnings: false
  rules: {}
  changed: { base: merge-base, require_owned_changes: true, require_plan_scope: true }
work:
  executable_requires_explicit_binding: true
  slicing: { max_editable_files: 4, max_editable_symbols: 8, max_verification_targets: 6, max_readonly_targets: 12, max_total_bytes: 120000 }
  context: { include_parent_principles: true, include_parent_rules: true, include_contract_counterparts: true, include_non_goals: true }
  inference: { allow_suggestions: true, suggestions_are_executable: false }
adapters: { enabled: [rust, typescript, openapi] }
