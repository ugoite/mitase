schema: syu/config/v1
workspace:
  spec_roots: [spec]
  artifact_roots: [web, api, tests, openapi.yaml]
  excludes: []
profiles:
  active: [web-app]
  custom:
    web-app:
      facets:
        ui: { include: [web/**] }
        backend: { include: [api/**] }
        api: { include: [openapi.yaml] }
        verification: { include: [tests/**] }
      contract_rules:
        - kind: http
          require_participants:
            - { role: provider, facets: [backend], min: 1 }
            - { role: consumer, facets: [ui], min: 1 }
validation:
  preset: agent-ready
  coverage:
    artifact_ownership: off
    spec_fulfillment: off
  deny_warnings: false
  rules: {}
  changed:
    baseline:
      strategy: merge-base
      against: origin/main
    require_owned_changes: true
work:
  slicing: { max_editable_files: 4, max_editable_symbols: 8, max_verification_targets: 6, max_readonly_targets: 12, max_total_bytes: 120000 }
  context: { include_parent_principles: true, include_parent_rules: true }
adapters: { enabled: [rust, typescript, openapi] }
