schema: syu/config/v1
workspace:
  spec_roots: [spec]
  artifact_roots: []
  excludes: []
  unexpected: true
profiles: { active: [], custom: {} }
validation:
  preset: standard
  coverage:
    artifact_ownership: off
    spec_fulfillment: off
  deny_warnings: false
  rules: {}
  changed:
    baseline:
      strategy: merge-base
      against: origin/main
    require_owned_changes: false
work:
  slicing: { max_editable_files: 1, max_editable_symbols: 1, max_verification_targets: 1, max_readonly_targets: 1, max_total_bytes: 1 }
  context: { include_parent_principles: false, include_parent_rules: false }
adapters: { enabled: [] }
