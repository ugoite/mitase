schema: syu/config/v1
workspace:
  spec_roots: [spec]
  source_roots: []
  ignore: []
  unexpected: true
profiles: { active: [], custom: {} }
validation:
  preset: standard
  deny_warnings: false
  rules: {}
  changed: { base: merge-base, require_owned_changes: false, require_plan_scope: false }
work:
  executable_requires_explicit_binding: true
  slicing: { max_editable_files: 1, max_editable_symbols: 1, max_verification_targets: 1, max_readonly_targets: 1, max_total_bytes: 1 }
  context: { include_parent_principles: false, include_parent_rules: false, include_contract_counterparts: false, include_non_goals: false }
  inference: { allow_suggestions: false, suggestions_are_executable: false }
adapters: { enabled: [] }
