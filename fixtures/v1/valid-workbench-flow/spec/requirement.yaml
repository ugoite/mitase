schema: syu/spec/v1
kind: requirements
namespace: fixture
category: Workbench flow
requirements:
  - id: REQ-FIXTURE-001
    title: Keep the fixture behavior valid
    description: The fixture exposes one bounded behavior for Workbench post-state validation.
    priority: high
    status: implemented
    criteria:
      - id: behavior
        kind: behavior
        statement: The fixture behavior returns true.
        governed_by: [POL-FIXTURE-001#rule.behavior]
      - id: add-symbol
        kind: behavior
        statement: An approved lifecycle transition can add one fixture symbol.
        governed_by: [POL-FIXTURE-001#rule.behavior]
      - id: add-file
        kind: behavior
        statement: An approved lifecycle transition can create one fixture file.
        governed_by: [POL-FIXTURE-001#rule.behavior]
      - id: remove-symbol
        kind: behavior
        statement: An approved lifecycle transition can remove one fixture symbol.
        governed_by: [POL-FIXTURE-001#rule.behavior]
      - id: remove-file
        kind: behavior
        statement: An approved lifecycle transition can remove one fixture file.
        governed_by: [POL-FIXTURE-001#rule.behavior]
    bindings:
      - id: verification
        role: verification
        facet: verification
        responsibility: Prove the fixture behavior remains valid.
        targets:
          - id: test
            adapter: rust
            path: tests/behavior.rs
            selector: { kind: symbol, name: behavior_stays_valid }
            claims:
              - kind: verifies
                criterion: REQ-FIXTURE-001#criterion.behavior
                covers: [FEAT-FIXTURE-001#binding.implementation/target.behavior]
                runner: { runner: cargo-test, arguments: { package: workbench-flow-fixture, test: behavior_stays_valid } }
          - id: add-symbol-test
            adapter: rust
            path: tests/behavior.rs
            selector: { kind: symbol, name: added_symbol_lifecycle_stays_valid }
            claims:
              - kind: verifies
                criterion: REQ-FIXTURE-001#criterion.add-symbol
                covers: [FEAT-LIFECYCLE-ADD-SYMBOL-001#binding.lifecycle/target.added-symbol]
                runner: { runner: cargo-test, arguments: { package: workbench-flow-fixture, test: added_symbol_lifecycle_stays_valid } }
          - id: add-file-test
            adapter: rust
            path: tests/behavior.rs
            selector: { kind: symbol, name: added_file_lifecycle_stays_valid }
            claims:
              - kind: verifies
                criterion: REQ-FIXTURE-001#criterion.add-file
                covers: [FEAT-LIFECYCLE-ADD-FILE-001#binding.lifecycle/target.added-file]
                runner: { runner: cargo-test, arguments: { package: workbench-flow-fixture, test: added_file_lifecycle_stays_valid } }
          - id: remove-symbol-test
            adapter: rust
            path: tests/behavior.rs
            selector: { kind: symbol, name: removed_symbol_lifecycle_stays_valid }
            claims:
              - kind: verifies
                criterion: REQ-FIXTURE-001#criterion.remove-symbol
                covers: [FEAT-LIFECYCLE-REMOVE-SYMBOL-001#binding.lifecycle/target.removed-symbol]
                runner: { runner: cargo-test, arguments: { package: workbench-flow-fixture, test: removed_symbol_lifecycle_stays_valid } }
          - id: remove-file-test
            adapter: rust
            path: tests/behavior.rs
            selector: { kind: symbol, name: removed_file_lifecycle_stays_valid }
            claims:
              - kind: verifies
                criterion: REQ-FIXTURE-001#criterion.remove-file
                covers: [FEAT-LIFECYCLE-REMOVE-FILE-001#binding.lifecycle/target.removed-file]
                runner: { runner: cargo-test, arguments: { package: workbench-flow-fixture, test: removed_file_lifecycle_stays_valid } }
