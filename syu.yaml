schema: syu/config/v1
workspace:
  spec_roots: [docs/syu]
  artifact_roots: [src, crates, docs, fixtures, tests]
  excludes: [target/**, node_modules/**, docs/generated/**]
profiles:
  active: [agent-ready]
  custom:
    agent-ready:
      facets:
        architecture: { include: [docs/**] }
        tooling: { include: [crates/**, src/**, fixtures/**, tests/**] }
        verification: { include: [crates/**, src/**, tests/**] }
        fixtures: { include: [fixtures/**] }
      contract_rules: []
validation:
  preset: agent-ready
  coverage:
    artifact_ownership: agent-ready
    spec_fulfillment: agent-ready
  deny_warnings: false
  rules: {}
  changed:
    require_owned_changes: true
work:
  slicing:
    max_editable_files: 4
    max_editable_symbols: 8
    max_verification_targets: 6
    max_readonly_targets: 12
    max_total_bytes: 120000
  context:
    include_parent_principles: true
    include_parent_rules: true
adapters:
  enabled: [rust, typescript, markdown, openapi, yaml, json]
