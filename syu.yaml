schema: syu/config/v1
workspace:
  spec_roots: [docs/syu]
  excludes: [target/**, node_modules/**, docs/generated/**]
inventory:
  active_profile: default
  profiles:
    - id: default
      providers:
        rust: {}
        javascript: {}
        documentation: {}
        markdown: {}
        declared: {}
validation:
  preset: agent-ready
  readiness:
    target: closed-loop
    scopes: { production: closed-loop, verification: verifiable, documentation: traceable, generated: traceable }
    probes: { implemented_criteria: all, public_entrypoints: all, contracts: all, changed_units: true }
    limits: { max_ownership_scope_units: 64, max_targets_per_binding: 12, max_slices_per_seed: 4 }
  changed:
    require_owned_changes: true
    require_plan: true
verification:
  runners:
    cargo-test:
      executable: cargo
      arguments: [test, -p, "{package}"]
work:
  slicing:
    max_editable_files: 4
    max_editable_symbols: 8
    max_verification_targets: 6
    max_readonly_targets: 12
    max_total_bytes: 120000
