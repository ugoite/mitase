validation:
  preset: agent-ready
  readiness:
    target: traceable
    scopes: { planner: work-ready, work: work-ready }
    probes: { implemented_criteria: "REQ-WORK-001#criterion.exact-slice,REQ-WORKBENCH-002#criterion.work-session", changed_units: false }
    limits: { max_ownership_scope_units: 160, max_targets_per_binding: 12, max_slices_per_seed: 4 }
  changed:
    baseline: { strategy: merge-base, against: origin/main }
    require_owned_changes: true
    require_plan: true
verification:
  runners:
    cargo-test:
      executable: cargo
      arguments: [test, -p, "{package}", "{test}", --, --exact]
    cargo-test-integration:
      executable: cargo
      arguments: [test, -p, "{package}", --test, "{harness}", "{test}", --, --exact]
work:
  slicing:
    max_editable_files: 4
    max_editable_symbols: 8
    max_verification_targets: 8
    max_readonly_targets: 12
    max_total_bytes: 120000
