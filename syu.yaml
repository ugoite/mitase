schema: syu/config/v1
workspace:
  spec_roots: [docs/syu]
  source_roots: [src, crates, docs, fixtures]
  ignore: [target/**, node_modules/**, docs/generated/**]
profiles:
  active: [agent-ready]
  custom:
    agent-ready:
      facets:
        architecture: { include: [docs/**] }
        tooling: { include: [crates/**, src/**] }
        verification: { include: [crates/**, tests/**] }
      contract_rules: []
validation:
  preset: agent-ready
  deny_warnings: false
  rules: {}
  changed:
    base: merge-base
    require_owned_changes: true
    require_plan_scope: true
work:
  executable_requires_explicit_binding: true
  slicing:
    max_editable_files: 4
    max_editable_symbols: 8
    max_verification_targets: 6
    max_readonly_targets: 12
    max_total_bytes: 120000
  context:
    include_parent_principles: true
    include_parent_rules: true
    include_contract_counterparts: true
    include_non_goals: true
  inference:
    allow_suggestions: true
    suggestions_are_executable: false
adapters:
  enabled: [rust, typescript, markdown, openapi, yaml, json]
