schema: mitase/config/v1
workspace:
  spec_roots: [docs/mitase]
  excludes: [target/**, node_modules/**, website/package-lock.json, website/package.json, .github/workflows/maintenance.yml]
inventory:
  discovery: true
  providers:
    markdown: { roots: [docs/understand] }
    declared:
      roots:
        - .github/workflows/ci.yml
        - README.md
        - crates/mitase-inventory/Cargo.toml
        - docs/contribute
        - docs/index.md
        - docs/mitase
        - docs/project
        - docs/reference
        - docs/reference/specification/index.md
        - docs/start-here
        - docs/understand
        - docs/workflows
        - editors/vscode/README.md
        - scripts/ci/check-generated-docs-freshness.sh
        - scripts/ci/coverage.sh
        - scripts/generate-docs-site-extras.py
        - scripts/generate-site-docs.py
        - website/docusaurus.config.js
        - website/sidebars.js
validation:
  preset: strict
  readiness:
    target: traceable
    probes:
      implemented_criteria:
        - criterion: REQ-CAPABILITY-001#criterion.spec-model
          level: verifiable
      public_entrypoints: { selection: all, level: seedable }
      changed_units: false
    limits: { max_ownership_scope_units: 64 }
  changed:
    baseline: { strategy: parent }
    require_owned_changes: true
verification:
  runners:
    cargo-test:
      executable: cargo
      arguments: [test, -p, "{package}", "{test}", --, --exact]
    cargo-test-integration:
      executable: cargo
      arguments: [test, -p, "{package}", --test, "{harness}", "{test}", --, --exact]
    shell:
      executable: bash
      arguments: ["{script}"]
