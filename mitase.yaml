validation:
  preset: strict
  readiness:
    target: traceable
    probes:
      implemented_criteria:
        - criterion: REQ-CAPABILITY-001#criterion.spec-model
          level: verifiable
      public_entrypoints: { selection: all, level: seedable }
      changed_units: false
    limits: { max_ownership_scope_units: 64 }
  changed:
    baseline: { strategy: parent }
    require_owned_changes: true
verification:
  runners:
    cargo-test:
      executable: cargo
      arguments: [test, -p, "{package}", "{test}", --, --exact]
    cargo-test-integration:
      executable: cargo
      arguments: [test, -p, "{package}", --test, "{harness}", "{test}", --, --exact]
    shell:
      executable: bash
      arguments: ["{script}"]
