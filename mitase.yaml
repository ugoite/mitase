validation:
  preset: agent-ready
  readiness:
    target: traceable
    probes:
      implemented_criteria:
        - criterion: REQ-WORK-001#criterion.exact-slice
          level: work-ready
        - criterion: REQ-WORKBENCH-002#criterion.work-session
          level: work-ready
      public_entrypoints: { selection: all, level: seedable }
      changed_units: false
    limits: { max_ownership_scope_units: 64, max_targets_per_binding: 12, max_slices_per_origin: 4 }
  changed:
    baseline: { strategy: parent }
    require_owned_changes: true
    require_plan: true
verification:
  runners:
    cargo-test:
      adapter: cargo-libtest
      executable: cargo
      arguments: [test, -p, "{package}", "{test}", --, --exact]
    cargo-test-integration:
      adapter: cargo-libtest
      executable: cargo
      arguments: [test, -p, "{package}", --test, "{harness}", "{test}", --, --exact]
    shell:
      adapter: shell
      executable: bash
      arguments: ["{script}"]
work:
  slicing:
    max_editable_files: 4
    max_editable_symbols: 8
    max_verification_targets: 8
    max_readonly_targets: 12
    # Measured envelope for the detail workspace context pack, including
    # declared trace/evidence and the existing public Workbench context.
    max_total_bytes: 160000
