schema: syu/spec/v1
kind: features
namespace: workbench
category: Workbench implementation
features:
- id: FEAT-WORKBENCH-WORK-UI-001
  title: Workbench work UI
  summary: Drive the WorkRequest to result-validation journey from the Work page.
  status: implemented
  bindings:
  - id: work
    role: implementation
    facet: work
    responsibility: Plan and validate a bounded Workbench work session.
    targets:
    - id: plan
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: api_plan
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-002#criterion.work-session
    owns:
    - id: planner-module
      adapter: rust
      path: crates/syu-planner/src/lib.rs
      selector:
        kind: module
        name: lib
    - id: work-model-module
      adapter: rust
      path: crates/syu-work-model/src/lib.rs
      selector:
        kind: module
        name: lib
    - id: cli-module
      adapter: rust
      path: src/lib.rs
      selector:
        kind: module
        name: lib
    - id: cli-main-module
      adapter: rust
      path: src/main.rs
      selector:
        kind: module
        name: main
    - id: cli-main-file
      adapter: rust
      path: src/main.rs
      selector:
        kind: file
    - id: lsp-module
      adapter: rust
      path: src/lsp/mod.rs
      selector:
        kind: module
        name: mod
    - id: lsp-file
      adapter: rust
      path: src/lsp/mod.rs
      selector:
        kind: file
    - id: lsp-handlers-module
      adapter: rust
      path: src/lsp/handlers.rs
      selector:
        kind: module
        name: handlers
    - id: lsp-handlers-file
      adapter: rust
      path: src/lsp/handlers.rs
      selector:
        kind: file
    - id: lsp-protocol-module
      adapter: rust
      path: src/lsp/protocol.rs
      selector:
        kind: module
        name: protocol
    - id: lsp-protocol-file
      adapter: rust
      path: src/lsp/protocol.rs
      selector:
        kind: file
    - id: lsp-server-module
      adapter: rust
      path: src/lsp/server.rs
      selector:
        kind: module
        name: server
    - id: lsp-server-file
      adapter: rust
      path: src/lsp/server.rs
      selector:
        kind: file
