          symbols:
            - WorkbenchState
            - CommandPaletteState
            - WorkbenchActionRegistry
            - WorkbenchActionAvailability
        - file: crates/syu-app-ui/src/lib.rs
          symbols:
            - AppShell
            - CommandPalette
            - WorkspacePulse
            - GoalRail
            - GoalCanvas
            - EvidencePanel
            - StatusBar
      markdown:
        - file: docs/guide/workbench.md
          symbols:
            - command palette registry
            - WorkbenchState
            - CommandPaletteState
            - request.classify
