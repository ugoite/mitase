category: Workbench
version: 1

features:
  - id: FEAT-WORKBENCH-SHELL-001
    title: Command-palette Workbench shell
    summary: Keep the command palette as the keyboard-first action surface inside a shared shell with four persistent roles (Items, Work, Scope, and Diagnostics), focused Work and Scope subviews, command-to-role routing, a collapsible and editable spec tree, and distinct refreshable diagnostics.
    status: implemented
    linked_requirements:
      - REQ-WORKBENCH-001
      - REQ-WORKBENCH-006
      - REQ-WORKBENCH-007
    implementations:
      rust:
        - file: crates/syu-workbench/src/lib.rs
          symbols:
            - WorkbenchState
            - CommandPaletteState
            - WorkbenchActionRegistry
            - WorkbenchActionAvailability
        - file: crates/syu-app-ui/src/lib.rs
          symbols:
            - AppShell
            - CommandPalette
            - WorkbenchPane
            - RequestIntakeCanvas
            - GoalRail
            - GoalCanvas
            - EvidencePanel
            - StatusBar
        - file: crates/syu-app-ui/src/components/shell.rs
          symbols:
            - SpecInfoBrowser
        - file: tests/workbench_smoke.rs
          symbols:
            - app_shell_renders_command_palette_first_shell
            - command_palette_renders_disabled_reason_for_unavailable_actions
            - goal_canvas_renders_a_read_only_action_preview_placeholder
            - evidence_panel_renders_placeholder_when_empty
        - file: crates/syu-workbench-server/src/tests.rs
          symbols:
            - role_menu_routes_commands_to_items_and_diagnostics
            - item_edit_previews_and_applies_reciprocal_links_together
            - diagnostics_refresh_all_runs_unique_tools_and_skips_missing_goal
            - items_surface_opens_before_workspace_initialization
      markdown:
        - file: docs/guide/workbench.md
          symbols:
            - command palette registry
            - WorkbenchState
            - CommandPaletteState
            - request.classify
