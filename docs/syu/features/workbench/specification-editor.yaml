schema: syu/spec/v1
kind: features
namespace: workbench
category: Workbench implementation
features:
- id: FEAT-WORKBENCH-SPEC-EDITOR-001
  title: Workbench specification editor
  summary: Preview and apply structured specification and configuration edits transactionally.
  status: implemented
  bindings:
  - id: editor
    role: implementation
    facet: editor
    responsibility: Apply validated structured edits through the Workbench transaction boundary.
    targets:
    - id: specification-apply
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: api_specification_apply
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-003#criterion.transactional-spec-edit
    - id: config-apply
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: api_config_apply
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-004#criterion.transactional-config-edit
    - id: specification-candidates
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: api_specification_candidates
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-007#criterion.guided-specification-selection
    - id: specification-candidate-preview
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: api_specification_candidate_preview
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-007#criterion.guided-specification-selection
    - id: specification-nested-edit
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: nested_patch_content
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-014#criterion.typed-nested-specification-edit
    - id: specification-detail-trace
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: specification_trace_view
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-014#criterion.canonical-detail-trace
    - id: specification-detail-workspace
      adapter: javascript
      path: crates/syu-app-ui/assets/js/pages/specifications.js
      selector:
        kind: symbol
        name: renderSpecificationWorkspace
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-014#criterion.canonical-detail-trace
      - kind: satisfies
        criterion: REQ-WORKBENCH-014#criterion.declaration-runtime-evidence
    - id: specification-detail-router
      adapter: javascript
      path: crates/syu-app-ui/assets/js/router.js
      selector:
        kind: symbol
        name: bindRouter
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-014#criterion.detail-deep-link
  - id: detail-verification
    role: verification
    facet: verification
    responsibility: Verify canonical detail trace, typed nested edits, and browser detail contracts.
    targets:
    - id: detail-trace-test
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: tests::specification_trace_reaches_external_workbench_targets_from_spec_index
      claims:
      - kind: verifies
        criterion: REQ-WORKBENCH-014#criterion.canonical-detail-trace
        covers:
        - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-detail-trace
        - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-detail-workspace
        runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::specification_trace_reaches_external_workbench_targets_from_spec_index } }
      - kind: verifies
        criterion: REQ-WORKBENCH-014#criterion.declaration-runtime-evidence
        covers:
        - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-detail-workspace
        runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::specification_trace_reaches_external_workbench_targets_from_spec_index } }
    - id: detail-nested-edit-test
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: tests::typed_nested_binding_and_target_edits_round_trip_without_yaml_maps
      claims:
      - kind: verifies
        criterion: REQ-WORKBENCH-014#criterion.typed-nested-specification-edit
        covers:
        - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-nested-edit
        runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::typed_nested_binding_and_target_edits_round_trip_without_yaml_maps } }
    - id: detail-browser-contract-test
      adapter: rust
      path: crates/syu-workbench-server/src/lib.rs
      selector:
        kind: symbol
        name: tests::workbench_accessible_navigation
      claims:
      - kind: verifies
        criterion: REQ-WORKBENCH-014#criterion.detail-deep-link
        covers:
        - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-detail-router
        runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_accessible_navigation } }
    owns:
    - id: spec-model-module
      adapter: rust
      path: crates/syu-spec-model/src/lib.rs
      selector:
        kind: module
        name: lib
    - id: app-ui-components-module
      adapter: rust
      path: crates/syu-app-ui/src/components.rs
      selector:
        kind: module
        name: components
    - id: app-ui-components-file
      adapter: rust
      path: crates/syu-app-ui/src/components.rs
      selector:
        kind: file
    - id: app-ui-document-module
      adapter: rust
      path: crates/syu-app-ui/src/document.rs
      selector:
        kind: module
        name: document
    - id: app-ui-document-file
      adapter: rust
      path: crates/syu-app-ui/src/document.rs
      selector:
        kind: file
    - id: app-ui-lib-module
      adapter: rust
      path: crates/syu-app-ui/src/lib.rs
      selector:
        kind: module
        name: lib
    - id: app-ui-pages-module
      adapter: rust
      path: crates/syu-app-ui/src/pages.rs
      selector:
        kind: module
        name: pages
    - id: app-ui-pages-file
      adapter: rust
      path: crates/syu-app-ui/src/pages.rs
      selector:
        kind: file
    - id: app-ui-shell-module
      adapter: rust
      path: crates/syu-app-ui/src/shell.rs
      selector:
        kind: module
        name: shell
    - id: app-ui-shell-file
      adapter: rust
      path: crates/syu-app-ui/src/shell.rs
      selector:
        kind: file
