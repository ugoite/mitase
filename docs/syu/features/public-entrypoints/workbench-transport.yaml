    role: implementation
    facet: public
    responsibility: Keep this public entrypoint addressable by an exact target.
    targets:
    - id: entrypoint-001-javascript-crates-syu-app-ui-assets-js-api-js-mutationb
      adapter: javascript
      path: crates/syu-app-ui/assets/js/api.js
      selector:
        kind: symbol
        name: mutationBasis
      claims:
