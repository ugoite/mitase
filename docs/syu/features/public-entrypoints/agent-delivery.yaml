schema: syu/spec/v1
kind: features
namespace: public
category: Public entrypoint contracts
features:
- id: FEAT-PUBLIC-AGENT-DELIVERY-001
  title: Agent delivery evidence
  summary: Govern scoped-agent and durable delivery evidence entrypoints under the exact plan-and-slice identity.
  status: implemented
  bindings:
  - id: public-api-agent-current-run
    role: implementation
    facet: public
    responsibility: Govern current scoped-agent run reads.
    targets:
    - id: entrypoint-agent-current-run
      adapter: rust
      path: crates/syu-agent/src/lib.rs
      selector:
        kind: symbol
        name: current_run
      claims:
      - kind: exposes
        target: FEAT-AGENT-001#binding.implementation/target.agent-start
  - id: public-api-agent-events
    role: implementation
    facet: public
    responsibility: Govern scoped-agent event reads.
    targets:
    - id: entrypoint-agent-events
      adapter: rust
      path: crates/syu-agent/src/lib.rs
      selector:
        kind: symbol
        name: events
      claims:
      - kind: exposes
        target: FEAT-AGENT-001#binding.implementation/target.agent-start
  - id: public-api-agent-record-blocker
    role: implementation
    facet: public
    responsibility: Govern scoped-agent blocker evidence.
    targets:
    - id: entrypoint-agent-record-blocker
      adapter: rust
      path: crates/syu-agent/src/lib.rs
      selector:
        kind: symbol
        name: record_blocker
      claims:
      - kind: exposes
        target: FEAT-AGENT-001#binding.implementation/target.agent-start
  - id: public-api-agent-record-verification
    role: implementation
    facet: public
    responsibility: Govern scoped-agent verification evidence.
    targets:
    - id: entrypoint-agent-record-verification
      adapter: rust
      path: crates/syu-agent/src/lib.rs
      selector:
        kind: symbol
        name: record_verification
      claims:
      - kind: exposes
        target: FEAT-AGENT-001#binding.implementation/target.agent-start
  - id: public-api-delivery-agent-events
    role: implementation
    facet: public
    responsibility: Govern durable agent event reads.
    targets:
    - id: entrypoint-delivery-agent-events
      adapter: rust
      path: crates/syu-delivery/src/lib.rs
      selector:
        kind: symbol
        name: agent_events
      claims:
      - kind: exposes
        target: FEAT-DELIVERY-001#binding.implementation/target.delivery-store
  - id: public-api-delivery-agent-run
    role: implementation
    facet: public
    responsibility: Govern durable agent run reads.
    targets:
    - id: entrypoint-delivery-agent-run
      adapter: rust
      path: crates/syu-delivery/src/lib.rs
      selector:
        kind: symbol
        name: agent_run
      claims:
      - kind: exposes
        target: FEAT-DELIVERY-001#binding.implementation/target.delivery-store
  - id: public-api-delivery-latest-agent-run
    role: implementation
    facet: public
    responsibility: Govern latest durable agent run reads.
    targets:
    - id: entrypoint-delivery-latest-agent-run
      adapter: rust
      path: crates/syu-delivery/src/lib.rs
      selector:
        kind: symbol
        name: latest_agent_run
      claims:
      - kind: exposes
        target: FEAT-DELIVERY-001#binding.implementation/target.delivery-store
