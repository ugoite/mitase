          - { id: generated-philosophy-foundation, adapter: declared, path: docs/generated/site-spec/philosophies/foundation.md, selector: { kind: file } }
          - { id: generated-policy-delivery, adapter: declared, path: docs/generated/site-spec/policies/delivery.md, selector: { kind: file } }
          - { id: generated-requirement-capability-contracts, adapter: declared, path: docs/generated/site-spec/requirements/capability-contracts.md, selector: { kind: file } }
