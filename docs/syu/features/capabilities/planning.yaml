schema: syu/spec/v1
kind: features
namespace: capabilities
category: Syu functional units
features:
  - id: FEAT-PLANNER-001
    title: Canonical planning
    summary: Generate deterministic bounded execution slices from exact work seeds.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: planner
        responsibility: Generate deterministic bounded work slices.
        targets:
          - id: canonical-plan
            adapter: rust
            path: crates/syu-planner/src/lib.rs
            selector: { kind: symbol, name: plan }
            claims:
              - kind: satisfies
                criterion: REQ-WORK-001#criterion.exact-slice
              - kind: satisfies
                criterion: REQ-CAPABILITY-002#criterion.build-profile-scope
              - kind: satisfies
                criterion: REQ-CAPABILITY-002#criterion.coherent-cross-language
              - kind: satisfies
                criterion: REQ-CAPABILITY-002#criterion.generated-source

  - id: FEAT-CONTEXT-001
    title: Context export
    summary: Export bounded specification and artifact context for a slice.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: context
        responsibility: Export the bounded context pack for a canonical slice.
        targets:
          - id: context-export
            adapter: rust
            path: crates/syu-planner/src/lib.rs
            selector: { kind: symbol, name: export_context }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.context-export

  - id: FEAT-CONTRACT-001
    title: Contract closure
    summary: Close contract participants and guarantees over exact targets.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: contract
        responsibility: Represent exact contract participants and guarantees.
        targets:
          - id: contract-model
            adapter: rust
            path: crates/syu-spec-model/src/lib.rs
            selector: { kind: symbol, name: Contract }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.contract-closure }]

  - id: FEAT-VERIFICATION-001
    title: Verification execution
    summary: Execute configured verification runners and produce canonical receipts.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: verification
        responsibility: Execute configured exact verification targets and receipts.
        targets:
          - id: execute-verification
            adapter: rust
            path: crates/syu-validation/src/lib.rs
            selector: { kind: symbol, name: execute_verification }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.verification-execution

  - id: FEAT-PLAN-VALIDATION-001
    title: Plan validation
    summary: Validate a canonical work plan before execution.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: plan-validation
        responsibility: Replan and validate an execution plan before running commands.
        targets:
          - id: canonical-plan-validation
            adapter: rust
            path: crates/syu-validation/src/lib.rs
            selector: { kind: symbol, name: canonical_plan_for_execution }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.plan-validation

  - id: FEAT-RESULT-VALIDATION-001
    title: Result validation
    summary: Validate verification receipts, post-state, and explicit completion evidence against a plan.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: result-validation
        responsibility: Validate canonical receipts and post-state closure.
        targets:
          - id: receipt-validation
            adapter: rust
            path: crates/syu-validation/src/lib.rs
            selector: { kind: symbol, name: validate_verification_receipt }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.receipt-validation
          - id: completion-evaluation
            adapter: rust
            path: crates/syu-validation/src/lib.rs
            selector: { kind: symbol, name: evaluate_completion }
            claims:
              - kind: satisfies
                criterion: REQ-WORK-001#criterion.completion-evidence

  - id: FEAT-CLI-001
    title: CLI orchestration
    summary: Orchestrate workspace, work, readiness, and validation commands.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: cli
        responsibility: Orchestrate canonical validation and work commands.
        targets:
          - id: cli-run
            adapter: rust
            path: src/lib.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.cli-orchestration

  - id: FEAT-LSP-001
    title: LSP
    summary: Serve canonical specification navigation and hover information.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: lsp
        responsibility: Serve canonical specification language-server state.
        targets:
          - id: lsp-server
            adapter: rust
            path: src/lsp/mod.rs
            selector: { kind: symbol, name: run_lsp_server }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.lsp-navigation }]

  - id: FEAT-DOCS-001
    title: Documentation generation
    summary: Keep checked-in guides and generated specification documentation aligned.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: documentation
        responsibility: Maintain the generated specification documentation entrypoint and explicitly retire obsolete generated paths.
        owns:
          - { id: retired-generated-delivery, adapter: declared, path: docs/generated/site-spec/delivery.md, selector: { kind: file } }
          - { id: retired-generated-public-entrypoints, adapter: declared, path: docs/generated/site-spec/public-entrypoints.md, selector: { kind: file } }
          - { id: retired-generated-work, adapter: declared, path: docs/generated/site-spec/work.md, selector: { kind: file } }
          - { id: retired-generated-workbench-features, adapter: declared, path: docs/generated/site-spec/workbench-features.md, selector: { kind: file } }
          - { id: legacy-guide-getting-started, adapter: declared, path: docs/guide/getting-started.md, selector: { kind: file } }
          - { id: legacy-generated-documentation-page, adapter: declared, path: docs/generated/site-spec/features/documentation/docs.md, selector: { kind: file } }
          - { id: generated-feature-capabilities-core, adapter: declared, path: docs/generated/site-spec/features/capabilities/core.md, selector: { kind: file } }
          - { id: generated-feature-capabilities-delivery, adapter: declared, path: docs/generated/site-spec/features/capabilities/delivery.md, selector: { kind: file } }
          - { id: generated-feature-capabilities-planning, adapter: declared, path: docs/generated/site-spec/features/capabilities/planning.md, selector: { kind: file } }
          - { id: generated-feature-planner, adapter: declared, path: docs/generated/site-spec/features/planner.md, selector: { kind: file } }
          - { id: generated-entrypoint-agent-delivery, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/agent-delivery.md, selector: { kind: file } }
          - { id: generated-entrypoint-code-diagnostics, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/code-diagnostics.md, selector: { kind: file } }
          - { id: generated-entrypoint-inventory, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/inventory.md, selector: { kind: file } }
          - { id: generated-entrypoint-spec-model, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/spec-model.md, selector: { kind: file } }
          - { id: generated-entrypoint-validation, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/validation.md, selector: { kind: file } }
          - { id: generated-entrypoint-work-planning, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/work-planning.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-actions, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-actions.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-components, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-components.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-navigation, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-navigation.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-pages, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-pages.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-rendering, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-rendering.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-server, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-server.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-transport, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-transport.md, selector: { kind: file } }
          - { id: generated-entrypoint-workbench-validation, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workbench-validation.md, selector: { kind: file } }
          - { id: generated-entrypoint-workspace-loading, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workspace-loading.md, selector: { kind: file } }
          - { id: generated-entrypoint-workspace-resolution, adapter: declared, path: docs/generated/site-spec/features/public-entrypoints/workspace-resolution.md, selector: { kind: file } }
          - { id: generated-workbench-completion-history, adapter: declared, path: docs/generated/site-spec/features/workbench/completion-history.md, selector: { kind: file } }
          - { id: generated-workbench-guided-journey, adapter: declared, path: docs/generated/site-spec/features/workbench/guided-journey.md, selector: { kind: file } }
          - { id: generated-workbench-navigation, adapter: declared, path: docs/generated/site-spec/features/workbench/navigation.md, selector: { kind: file } }
          - { id: generated-workbench-projection, adapter: declared, path: docs/generated/site-spec/features/workbench/projection.md, selector: { kind: file } }
          - { id: generated-workbench-quality-gates, adapter: declared, path: docs/generated/site-spec/features/workbench/quality-gates.md, selector: { kind: file } }
