category: Quality Automation
version: 1

features:
  - id: FEAT-QUALITY-001
    title: Repository quality automation
    summary: Keep self-validation, dependency hygiene across Rust, GitHub Actions, the docs site, and the browser app, code scanning, and merge-queue-safe CI execution split into fast branch feedback, PR confidence, merge-queue enforcement, and maintenance checks.
    status: implemented
    linked_requirements:
      - REQ-CORE-005
      - REQ-CORE-006
      - REQ-CORE-014
    implementations:
      shell:
        - file: scripts/ci/quality-gates.sh
          symbols:
            - run_quality_gates
        - file: scripts/dev/validate-changed.sh
          symbols:
            - validate_changed
        - file: scripts/ci/validate-app.sh
          symbols:
            - run_optional_e2e
            - validate_app
        - file: scripts/ci/validate-website.sh
          symbols:
            - validate_website
        - file: scripts/ci/coverage.sh
          symbols:
            - configure_llvm_tools
            - enforce_diff_coverage
            - enforce_lcov_threshold
            - run_coverage
        - file: scripts/ci/check-generated-docs-freshness.sh
          symbols:
            - check_generated_docs_freshness
        - file: scripts/ci/check-browser-app-freshness.sh
          symbols:
            - check_browser_app_freshness
        - file: scripts/ci/check-merge-queue-health.sh
          symbols:
            - load_required_merge_queue_workflows
            - fetch_merge_queue_state
            - fetch_merge_group_runs
            - render_watchdog_report
            - check_merge_queue_health
            - main
        - file: scripts/ci/requeue-dropped-merge-queue-prs.sh
          symbols:
            - requeue_dropped_merge_queue_prs
            - fetch_pull_request_queue_state
            - select_requeue_candidates
            - reenroll_candidates
        - file: scripts/ci/pinned-npm.sh
          symbols:
            - FEAT-QUALITY-001
            - check
            - install
      yaml:
        - file: .pre-commit-config.yaml
          symbols:
            - syu-validate-changed
            - syu-quality-gates
            - syu-coverage-gate
        - file: .github/workflows/ci.yml
          symbols:
            - merge_group
            - file-hygiene
            - quality-fast
            - quality-full
            - coverage-pr
            - coverage-full
            - actionlint
            - dependency-review
            - spec-linkage
            - squash-history-spec-ids
            - browser-app
            - installer-smoke
            - installed-binary-smoke
            - docs-site
            - ci-required
            - "./.github/actions/setup-rust"
            - taiki-e/cache-cargo-install-action@v3
            - "tool: cargo-llvm-cov"
            - Set up Python with pip cache
            - "cache-dependency-path: app/package-lock.json"
            - Cache pre-commit hooks
            - actions/cache@v5
            - "~/.cache/pre-commit"
            - scripts/ci/pinned-npm.sh install app
            - Build browser app bundle
            - Review dependency changes
            - "scripts/ci/quality-gates.sh fast"
            - "scripts/ci/quality-gates.sh full"
            - "scripts/ci/coverage.sh pr"
            - "scripts/ci/coverage.sh lcov"
        - file: .github/workflows/branch-push.yml
          symbols:
            - duplicate-check
            - has_open_pr
            - scripts/ci/quality-gates.sh fast
        - file: .github/workflows/maintenance.yml
          symbols:
            - dependency-audit
            - npm-audit
            - schedule
            - workflow_dispatch
            - cargo audit
            - npm audit
        - file: .github/actions/setup-rust/action.yml
          symbols:
            - Restore Rust cache
            - Swatinem/rust-cache@v2
        - file: .github/actions/build-docs-site/action.yml
          symbols:
            - actions/setup-node@v6
            - "cache-dependency-path: website/package-lock.json"
            - install-docs-site-deps.sh
            - scripts/ci/pinned-npm.sh install website
        - file: .github/workflows/codeql.yml
          symbols:
            - merge_group
            - codeql-required
            - github/codeql-action/init@v4
        - file: .github/workflows/merge-queue-watchdog.yml
          symbols:
            - schedule
            - workflow_dispatch
            - scripts/ci/check-merge-queue-health.sh
        - file: .github/workflows/merge-queue-reenroll.yml
          symbols:
            - workflow_dispatch
            - schedule
            - reenroll
            - Re-enroll dropped merge queue PRs
        - file: .github/dependabot.yml
          symbols:
            - FEAT-QUALITY-001
            - package-ecosystem
            - target-branch
            - "directory: /website"
            - "directory: /app"
