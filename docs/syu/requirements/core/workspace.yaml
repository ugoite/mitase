  - id: REQ-CORE-031
    title: Generate temporary Goal Plans from scoped requests
    description: |
      The CLI MUST provide a `task plan` command that reads a captured request
      artifact, reuses the current scope graph, and produces a temporary Goal
      Plan artifact with source, goal, spec mapping, implementation, test,
      coverage, completion, and warning sections. The command SHOULD be able to
      print the plan as text, YAML, or JSON; SHOULD write the artifact to a
      caller-selected output path; and SHOULD warn when that output path is
      placed inside `spec.root`, because the Goal Plan is intended to stay
      outside the persistent spec tree. The repository MUST document temporary
      Goal Plan artifacts as delivery artifacts that may live in task files, PR
      bodies, issue bodies, CI artifacts, or other ephemeral locations outside
      `spec.root`. Goal Plans MUST stay separate from the persistent philosophy,
      policy, requirement, and feature layers, SHOULD carry explicit goal,
      scope, test, coverage, and completion fields, and SHOULD support both
      request-driven and diff-inferred sources with an explicit confidence
      signal for inferred plans. The default `syu validate .` workflow MUST not
      require Goal Plans to exist and MUST not treat `.syu/tasks` as persistent
      spec content unless a future configuration explicitly opts in.
    priority: medium
    status: implemented
    linked_policies:
      - POL-001
      - POL-002
      - POL-004
    linked_features:
      - FEAT-TASK-004
    tests:
      rust:
        - file: src/command/task.rs
          symbols:
