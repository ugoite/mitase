schema: syu/spec/v1
kind: requirements
namespace: workbench
category: Workbench behavior
requirements:
  - id: REQ-WORKBENCH-001
    title: Canonical projection
    description: The Workbench renders server-owned canonical projection state.
    priority: critical
    status: implemented
    criteria:
      - id: canonical-projection
        kind: behavior
        statement: Projection data is read from the Workbench server without client-side semantic inference.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
  - id: REQ-WORKBENCH-002
    title: Work session
    description: A Workbench session carries one typed WorkRequest origin, a canonical candidate or selected WorkPlan, context, verification, and result state.
    priority: critical
    status: implemented
    criteria:
      - id: work-session
        kind: behavior
        statement: A selected Requirement criterion, Feature implementation binding, or exact implementation target can be planned, split into server-projected choices, selected as one canonical slice, and validated through the session API.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: work-check
        role: verification
        facet: verification
        responsibility: Verify the Workbench session execution path.
        targets:
          - id: work-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_work_session_flow }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-002#criterion.work-session
                covers: [FEAT-WORKBENCH-WORK-UI-001#binding.work/target.plan]
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_work_session_flow } }
  - id: REQ-WORKBENCH-003
    title: Transactional specification edit
    description: Structured specification edits are previewed and atomically applied only after canonical validation.
    priority: high
    status: implemented
    criteria:
      - id: transactional-spec-edit
        kind: behavior
        statement: A stale or invalid specification edit is rejected without changing the canonical source.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: spec-edit-check
        role: verification
        facet: verification
        responsibility: Verify transactional specification editing.
        targets:
          - id: spec-edit-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_spec_edit_transaction }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-003#criterion.transactional-spec-edit
                covers: [FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-apply]
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_spec_edit_transaction } }
  - id: REQ-WORKBENCH-007
    title: Guided specification selection
    description: The Workbench searches typed specification candidates and previews safe human-facing edits with graph and work impact.
    priority: high
    status: implemented
    criteria:
      - id: guided-specification-selection
        kind: behavior
        statement: A candidate search and typed specification edit preserves advanced links and requires validated preview evidence before apply.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: guided-specification-check
        role: verification
        facet: verification
        responsibility: Verify guided specification search, preview, and typed creation.
        targets:
          - id: guided-specification-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_specification_candidates_support_search_edit_and_create }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-007#criterion.guided-specification-selection
                covers:
                  - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-candidates
                  - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-candidate-preview
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_specification_candidates_support_search_edit_and_create } }
  - id: REQ-WORKBENCH-004
    title: Transactional configuration edit
    description: Structured configuration edits use the same preview, basis, and atomic apply flow.
    priority: high
    status: implemented
    criteria:
      - id: transactional-config-edit
        kind: behavior
        statement: A configuration candidate is applied only after overlay validation succeeds.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: config-edit-check
        role: verification
        facet: verification
        responsibility: Verify transactional configuration editing.
        targets:
          - id: config-edit-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_config_edit_transaction }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-004#criterion.transactional-config-edit
                covers: [FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.config-apply]
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_config_edit_transaction } }
  - id: REQ-WORKBENCH-008
    title: Reviewed target suggestions
    description: The Workbench ranks exact implementation and verification candidates with human-readable evidence before any executable scope is created.
    priority: high
    status: implemented
    criteria:
      - id: reviewed-target-suggestions
        kind: behavior
        statement: Suggestions remain advisory until explicit approval, rejected evidence stays suppressed, approved candidates persist against exact criterion evidence and are consumed as WorkRequest targets only when criterion-level Create Work starts, and budget overflow recommends split work.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: target-suggestion-check
        role: verification
        facet: verification
        responsibility: Verify advisory suggestions, evidence-bound rejection, and exact approval.
        targets:
          - id: target-suggestion-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::target_suggestions_remain_advisory_until_create_work }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-008#criterion.reviewed-target-suggestions
                covers:
                  - FEAT-WORKBENCH-TARGET-SUGGESTIONS-001#binding.suggestions/target.rank-candidates
                  - FEAT-WORKBENCH-TARGET-SUGGESTIONS-001#binding.suggestions/target.approve-candidates
                  - FEAT-WORKBENCH-TARGET-SUGGESTIONS-001#binding.suggestions/target.suggestion-review-ui
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::target_suggestions_remain_advisory_until_create_work } }
  - id: REQ-WORKBENCH-005
    title: Secure local server
    description: The Workbench server is loopback-first and protects mutation endpoints.
    priority: critical
    status: implemented
    criteria:
      - id: secure-local-server
        kind: security
        statement: Remote bind requires a session token and mutations require CSRF and origin checks.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: security-check
        role: verification
        facet: verification
        responsibility: Verify secure Workbench server launch and mutation guards.
        targets:
          - id: security-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_security_flow }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-005#criterion.secure-local-server
                covers: [FEAT-WORKBENCH-SERVER-001#binding.server/target.mutation-guard]
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_security_flow } }
  - id: REQ-WORKBENCH-006
    title: Accessible navigation
    description: Workbench primary pages and actions are keyboard navigable and localized.
    priority: medium
    status: implemented
    criteria:
      - id: accessible-navigation
        kind: quality
        statement: The primary Workbench pages expose semantic controls and matching Japanese and English catalogs.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: navigation-check
        role: verification
        facet: verification
        responsibility: Verify accessible Workbench navigation and localization.
        targets:
          - id: navigation-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_accessible_navigation }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-006#criterion.accessible-navigation
                covers:
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.html-navigation
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.javascript-navigation
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.keyboard-navigation
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.accessibility-attributes
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.workbench-css
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_accessible_navigation } }
  - id: REQ-WORKBENCH-009
    title: Durable completion history
    description: Workbench renders the shared completion attempt history and finalization state from the server-owned store.
    priority: critical
    status: implemented
    criteria:
      - id: completion-history
        kind: behavior
        statement: Current and previous attempts expose plan and slice identity, status, blockers, next action, demonstrated criteria, and finalized state.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
  - id: REQ-WORKBENCH-012
    title: Responsive interaction foundation
    description: Workbench interactions reuse canonical workspace state and expose visible progress without weakening stale-view safety.
    priority: critical
    status: implemented
    criteria:
      - id: exact-snapshot-reuse
        kind: quality
        statement: Unchanged repository state reuses one workspace, inventory index, and projection snapshot while changed tracked, staged, deleted, renamed, or untracked content invalidates it before the next operation.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: responsive-browser-interactions
        kind: quality
        statement: The browser bootstraps without a duplicate projection, renders only the active page, filters empty specification queries locally, reports canonical workspace identity, and prevents duplicate actions while busy.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: responsiveness-check
        role: verification
        facet: verification
        responsibility: Verify exact snapshot reuse and content-sensitive invalidation.
        targets:
          - id: responsiveness-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_snapshot_reuses_unchanged_state_and_invalidates_content_changes }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-012#criterion.exact-snapshot-reuse
                covers:
                  - FEAT-WORKBENCH-SERVER-001#binding.server/target.workspace-snapshot
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_snapshot_reuses_unchanged_state_and_invalidates_content_changes } }
              - kind: verifies
                criterion: REQ-WORKBENCH-012#criterion.responsive-browser-interactions
                covers:
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.projection-bootstrap
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.active-page-render
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.local-specification-filter
                  - FEAT-WORKBENCH-NAVIGATION-001#binding.navigation/target.busy-status
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_snapshot_reuses_unchanged_state_and_invalidates_content_changes } }
  - id: REQ-WORKBENCH-010
    title: Layered quality gates
    description: Local hooks and CI apply proportional quality checks without weakening the complete release gate.
    priority: high
    status: implemented
    criteria:
      - id: lifecycle-separation
        kind: quality
        statement: Pre-commit validates the staged snapshot, pre-push scopes fast Rust and specification checks to the push diff, and CI runs the complete workspace gate.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
  - id: REQ-WORKBENCH-011
    title: Scoped agent evidence
    description: Workbench exposes the approved agent boundary and its server-owned execution evidence, including lifecycle proofs for approved target creation and deletion.
    priority: critical
    status: implemented
    criteria:
      - id: scoped-agent
        kind: security
        statement: Workbench can start a scoped agent only for an approved slice, applies only its exact Modify, Add, or Remove transitions, and shows accepted, rejected, blocked, and expansion events.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
  - id: REQ-WORKBENCH-013
    title: Guided non-programmer journey
    description: Workbench guides a person through a bounded change without requiring repository internals.
    priority: critical
    status: implemented
    criteria:
      - id: guided-journey
        kind: behavior
        statement: Workbench exposes one explained next action, a friendly work identity, separately labeled advisory and approved scope, completion evidence, and a cancellable recovery path while technical identities remain under Advanced details.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: linked-specification-context
        kind: behavior
        statement: After one exact criterion is selected, Workbench renders the linked specification detail in a read-only split or collapsed narrow-screen context and lets people move between the requirement, feature, exact implementation, and verification evidence without leaving the work journey.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
  - id: REQ-WORKBENCH-014
    title: Advisory multilingual specification discovery
    description: Workbench helps people discover a suitable specification across wording and language differences without treating a ranked result as executable scope.
    priority: high
    status: implemented
    criteria:
      - id: advisory-multilingual-discovery
        kind: behavior
        statement: Candidate discovery combines disclosed lexical and deterministic multilingual semantic signals, then shows graph and completion-history context together with the exact criterion anchors that a person may choose.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: recovery-authoring
        kind: behavior
        statement: A no-match journey keeps authoring in context by offering a criterion addition to an existing Requirement or a new Requirement or Feature through the validated specification authoring boundary.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: exact-anchor-approval
        kind: security
        statement: Discovery results and target suggestions remain advisory, and no discovery result creates a WorkRequest until a person explicitly selects one existing exact criterion anchor and approves its exact targets.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: discovery-check
        role: verification
        facet: verification
        responsibility: Verify multilingual advisory ranking, false-positive recovery, typed authoring, and exact-anchor scope protection.
        targets:
          - id: discovery-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::advisory_specification_discovery_is_multilingual_and_never_creates_scope }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-014#criterion.advisory-multilingual-discovery
                covers:
                  - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.specification-candidates
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::advisory_specification_discovery_is_multilingual_and_never_creates_scope } }
              - kind: verifies
                criterion: REQ-WORKBENCH-014#criterion.recovery-authoring
                covers:
                  - FEAT-WORKBENCH-SPEC-EDITOR-001#binding.editor/target.criterion-authoring
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_specification_candidates_support_search_edit_and_create } }
              - kind: verifies
                criterion: REQ-WORKBENCH-014#criterion.exact-anchor-approval
                covers:
                  - FEAT-WORKBENCH-GUIDED-JOURNEY-001#binding.journey/target.journey-action
                  - FEAT-WORKBENCH-GUIDED-JOURNEY-001#binding.journey/target.journey-browser
                  - FEAT-WORKBENCH-GUIDED-JOURNEY-001#binding.journey/target.journey-discovery
                  - FEAT-WORKBENCH-GUIDED-JOURNEY-001#binding.journey/target.journey-target-suggestions
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::advisory_specification_discovery_is_multilingual_and_never_creates_scope } }

  - id: REQ-WORKBENCH-015
    title: Canonical specification detail workspace
    description: The specification detail surface is one bounded, server-owned workspace for canonical trace, evidence, and typed nested edits.
    priority: critical
    status: implemented
    criteria:
      - id: canonical-detail-trace
        kind: behavior
        statement: Specification detail renders a deterministic bounded neighbourhood from the server-owned SpecIndex, preserving readable and exact canonical facts without browser-side claim joins or closure inference.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: typed-nested-specification-edit
        kind: behavior
        statement: Binding, ownership, target, claim, and contract changes use typed nested operations with the same basis, preview, stale rejection, and impact invalidation as top-level edits.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: declaration-runtime-evidence
        kind: behavior
        statement: Evidence distinguishes declared implementation and verification targets from item-scoped runtime status and never labels declaration-only facts as a completed run.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
      - id: detail-deep-link
        kind: quality
        statement: Detail tabs, trace mode/depth, and inspected targets round-trip through URL state with keyboard and narrow-layout semantics.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
  - id: REQ-WORKBENCH-016
    title: Bounded detail context
    description: The detail workspace keeps its disclosed trace, evidence, and existing Workbench context within an explicit measured serialization budget.
    priority: high
    status: implemented
    criteria:
      - id: bounded-detail-context
        kind: quality
        statement: The detail workspace context pack remains bounded by the measured 120,000-byte Work slicing limit, and the limit is covered by an executable configuration contract.
        governed_by: [POL-DELIVERY-001#rule.exact-ownership]
    bindings:
      - id: detail-context-budget-check
        role: verification
        facet: verification
        responsibility: Verify that the measured detail context serialization budget remains explicit and bounded.
        targets:
          - id: detail-context-budget-test
            adapter: rust
            path: crates/syu-workbench-server/src/lib.rs
            selector: { kind: symbol, name: tests::workbench_detail_context_budget_is_explicitly_bounded }
            claims:
              - kind: verifies
                criterion: REQ-WORKBENCH-016#criterion.bounded-detail-context
                covers:
                  - FEAT-WORKBENCH-SPEC-DETAIL-001#binding.detail-workspace/target.detail-trace
                runner: { runner: cargo-test, arguments: { package: syu-workbench-server, test: tests::workbench_detail_context_budget_is_explicitly_bounded } }
