schema: mitase/spec/v1
kind: features
namespace: workbench
category: Workbench implementation
features:
- id: FEAT-WORKBENCH-QUALITY-GATES-001
  title: Layered quality gates
  summary: Separate staged pre-commit checks, push-diff fast checks, and complete CI validation.
  status: implemented
  bindings:
  - id: quality-gates
    role: implementation
    facet: repository-tooling
    responsibility: Run only the quality checks appropriate to each Git lifecycle stage.
    targets:
    - id: quality-gate-script
      adapter: declared
      path: scripts/ci/quality-gates.sh
      selector:
        kind: file
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-010#criterion.lifecycle-separation
    - id: release-artifacts-configuration
      adapter: declared
      path: .github/workflows/release-artifacts.yml
      selector: { kind: file }
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-010#criterion.lifecycle-separation
    - id: pre-commit-configuration
      adapter: declared
      path: .pre-commit-config.yaml
      selector: { kind: file }
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-010#criterion.lifecycle-separation
    - id: pre-commit-ci-configuration
      adapter: declared
      path: .pre-commit-ci.yaml
      selector: { kind: file }
      claims:
      - kind: satisfies
        criterion: REQ-WORKBENCH-010#criterion.lifecycle-separation
    owns:
    - id: repository-instructions
      adapter: declared
      path: AGENTS.md
      selector: { kind: file }
    - id: mise-configuration
      adapter: declared
      path: mise.toml
      selector: { kind: file }
    - id: rust-toolchain-configuration
      adapter: declared
      path: rust-toolchain.toml
      selector: { kind: file }
    - id: rust-setup-action
      adapter: declared
      path: .github/actions/setup-rust/action.yml
      selector: { kind: file }
    - id: pull-request-template
      adapter: declared
      path: .github/pull_request_template.md
      selector: { kind: file }
    - id: pull-request-issue-workflow
      adapter: declared
      path: .github/workflows/pr-require-close-issue.yml
      selector: { kind: file }
    - id: repository-skills
      adapter: declared
      path: .agents/skills
      selector: { kind: path-prefix, value: .agents/skills }
    - id: ci-workflow
      adapter: declared
      path: .github/workflows/ci.yml
      selector: { kind: file }
    - id: quality-workflow
      adapter: declared
      path: .github/workflows/quality.yml
      selector: { kind: file }
    - id: branch-push-workflow
      adapter: declared
      path: .github/workflows/branch-push.yml
      selector: { kind: file }
    - id: release-artifacts-workflow
      adapter: declared
      path: .github/workflows/release-artifacts.yml
      selector: { kind: file }
    - id: pre-commit-config
      adapter: declared
      path: .pre-commit-config.yaml
      selector: { kind: file }
    - id: pre-commit-ci-config
      adapter: declared
      path: .pre-commit-ci.yaml
      selector: { kind: file }
    - id: contributing-guide
      adapter: declared
      path: CONTRIBUTING.md
      selector: { kind: file }
    - id: cargo-manifest
      adapter: declared
      path: Cargo.toml
      selector: { kind: file }
    - id: cargo-lock
      adapter: declared
      path: Cargo.lock
      selector: { kind: file }
    - id: root-build-script
      adapter: declared
      path: build.rs
      selector: { kind: file }
    - id: root-build-module
      adapter: rust
      path: build.rs
      selector: { kind: module, name: "*" }
    - id: changed-validation-hook
      adapter: declared
      path: scripts/dev/validate-changed.sh
      selector: { kind: file }
    - id: cli-validation
      adapter: declared
      path: src/lib.rs
      selector: { kind: file }
    - id: cli-validation-module
      adapter: rust
      path: src/lib.rs
      selector: { kind: module, name: lib }
    - id: cli-validation-tests
      adapter: declared
      path: tests/v1_cli.rs
      selector: { kind: file }
    - id: repository-configuration
      adapter: declared
      path: mitase.yaml
      selector: { kind: file }
    - id: workbench-contract-check
      adapter: declared
      path: scripts/ci/check-workbench-contract.py
      selector: { kind: file }
    - id: workbench-i18n-runtime-check
      adapter: declared
      path: scripts/ci/check-workbench-i18n.mjs
      selector: { kind: file }
    - id: workbench-visual-check
      adapter: declared
      path: scripts/ci/workbench-visual.sh
      selector: { kind: file }
    - id: installed-binary-smoke
      adapter: declared
      path: scripts/ci/installed-binary-smoke.sh
      selector: { kind: file }
  - id: quality-gates-verification
    role: verification
    facet: repository-tooling
    responsibility: Verify that staged validation uses the Git index snapshot.
    targets:
    - id: staged-validation-test
      adapter: rust
      path: tests/v1_cli.rs
      selector:
        kind: symbol
        name: staged_change_validation_uses_the_index_snapshot
      claims:
      - kind: verifies
        criterion: REQ-WORKBENCH-010#criterion.lifecycle-separation
        covers:
        - FEAT-WORKBENCH-QUALITY-GATES-001#binding.quality-gates/target.quality-gate-script
        - FEAT-WORKBENCH-QUALITY-GATES-001#binding.quality-gates/target.release-artifacts-configuration
        - FEAT-WORKBENCH-QUALITY-GATES-001#binding.quality-gates/target.pre-commit-configuration
        - FEAT-WORKBENCH-QUALITY-GATES-001#binding.quality-gates/target.pre-commit-ci-configuration
        runner:
          runner: cargo-test-integration
          arguments:
            package: mitase
            harness: v1_cli
            test: staged_change_validation_uses_the_index_snapshot
