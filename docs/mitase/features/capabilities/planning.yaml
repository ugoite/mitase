schema: mitase/spec/v1
kind: features
namespace: capabilities
category: Mitase functional units
features:
  - id: FEAT-PLANNER-001
    title: Canonical planning
    summary: Generate deterministic bounded execution slices from one exact Work origin, retaining a server-owned candidate plan until one slice is selected.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: planner
        responsibility: Generate deterministic bounded work slices with lifecycle-aware execution, origin closure, and explicit selection bases.
        owns:
          - id: planner-declared-options
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::DeclaredTargetPlanOptions' }
          - id: planner-suggestion-budget
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::SuggestionBudget' }
          - id: planner-target-options
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::TargetPlanOptions' }
          - id: planner-target-suggestion
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::TargetSuggestion' }
          - id: planner-apply-overrides
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::apply_changed_artifact_overrides' }
          - id: planner-approved-container-hash
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::approved_container_hash' }
          - id: planner-basis
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::basis' }
          - id: planner-selector-text
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::selector_text' }
          - id: planner-build-context
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::build_context_pack' }
          - id: planner-readonly-context
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::contract_readonly_context_for_target' }
          - id: planner-verification-targets
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::criterion_verification_targets' }
          - id: planner-finalize-slice
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::finalize_slice' }
          - id: planner-hex-digest
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::hex_digest' }
          - id: planner-one-target
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::one_target' }
          - id: planner-rebuild-split
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::rebuild_split_slice' }
          - id: planner-significant-terms
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::significant_terms' }
          - id: planner-suggestion-budget-calc
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::suggestion_budget' }
          - id: planner-suggestion-budget-bytes
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::suggestion_budget_bytes' }
          - id: planner-budget-exceeds
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::suggestion_budget_exceeds' }
          - id: planner-suggestion-digest
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::suggestion_digest' }
          - id: planner-suggestion-id
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::suggestion_id' }
          - id: planner-suggestion-token
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::suggestion_set_token' }
          - id: planner-targets
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::targets' }
          - id: planner-implementation-add-test
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests::implementation_add_does_not_pull_unapproved_missing_verification_target' }
          - id: planner-budget-split-test
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests::missing_add_targets_split_by_declared_budget_and_file_limit' }
          - id: planner-remove-suggestion-test
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests::planned_absent_exact_target_is_a_remove_suggestion_when_artifact_exists' }
          - id: planner-add-suggestion-test
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests::planned_missing_exact_target_is_an_add_suggestion_with_scope_metadata' }
          - id: planner-verification-runonly-test
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests::requested_add_verification_target_is_repeated_as_post_state_run_only' }
          - id: planner-verification-budget-test
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests::verification_add_targets_count_the_post_write_run_only_phase' }
          - id: planner-tests-module
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::tests[cfg(test)]' }
          - id: planner-target-access-uniqueness
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: module, name: 'lib::validate_target_access_uniqueness' }
          - id: work-model-agent-blocker
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::AgentBlocker' }
          - id: work-model-agent-change
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::AgentTargetChange' }
          - id: work-model-agent-digest
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::AgentTargetDigest' }
          - id: work-model-agent-write
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::AgentTargetWrite' }
          - id: work-model-finalization-receipt
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::FinalizationReceipt' }
          - id: work-model-plan-approval
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::PlanApproval' }
          - id: work-model-planned-target
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::PlannedTarget' }
          - id: work-model-lifecycle-proof
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::TargetLifecycleProof' }
          - id: work-model-transition
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::TargetTransition' }
          - id: work-model-verification-receipt
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::VerificationReceipt' }
          - id: work-model-empty-vec
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::is_empty_vec' }
          - id: work-model-stable-lifecycle
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::is_stable_target_lifecycle' }
          - id: work-model-readonly-excluding
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::readonly_targets_fingerprint_excluding_paths' }
          - id: work-model-readonly-fingerprint
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::readonly_targets_fingerprint_for_execution' }
          - id: work-model-verification-proof
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: 'lib::VerificationProof' }
          - id: work-model-verification-protocol-module
            adapter: rust
            path: crates/mitase-work-model/src/lib.rs
            selector: { kind: module, name: lib }
        targets:
          - id: canonical-plan
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: symbol, name: plan }
            claims:
              - kind: satisfies
                criterion: REQ-WORK-001#criterion.exact-slice
              - kind: satisfies
                criterion: REQ-CAPABILITY-002#criterion.build-profile-scope
              - kind: satisfies
                criterion: REQ-CAPABILITY-002#criterion.coherent-cross-language
              - kind: satisfies
                criterion: REQ-CAPABILITY-002#criterion.generated-source
          - id: lifecycle-plan
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: symbol, name: declared_target_plan }
            claims:
              - kind: satisfies
                criterion: REQ-WORK-001#criterion.exact-slice

  - id: FEAT-CONTEXT-001
    title: Context export
    summary: Export bounded specification and artifact context for a slice.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: context
        responsibility: Export the bounded context pack for a canonical slice.
        targets:
          - id: context-export
            adapter: rust
            path: crates/mitase-planner/src/lib.rs
            selector: { kind: symbol, name: export_context }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.context-export

  - id: FEAT-CONTRACT-001
    title: Contract closure
    summary: Close contract participants and guarantees over exact targets.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: contract
        responsibility: Represent exact contract participants and guarantees.
        targets:
          - id: contract-model
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: symbol, name: Contract }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.contract-closure }]

  - id: FEAT-VERIFICATION-001
    title: Verification execution
    summary: Execute configured verification runners, normalize their exact-test proofs, and produce canonical receipts.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: verification
        responsibility: Execute configured exact verification targets and receipts.
        targets:
          - id: execute-verification
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: symbol, name: execute_verification }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.verification-execution

  - id: FEAT-PLAN-VALIDATION-001
    title: Plan validation
    summary: Validate a canonical work plan before execution.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: plan-validation
        responsibility: Replan and validate an execution plan before running commands.
        targets:
          - id: canonical-plan-validation
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: symbol, name: canonical_plan_for_execution }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.plan-validation

  - id: FEAT-RESULT-VALIDATION-001
    title: Result validation
    summary: Validate the shared verification proof and receipt contract, lifecycle post-state, and explicit completion evidence against a plan.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: result-validation
        responsibility: Validate canonical receipts, target lifecycle proofs, and post-state closure.
        targets:
          - id: receipt-validation
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: symbol, name: validate_verification_receipt }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.receipt-validation
          - id: completion-evaluation
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: symbol, name: evaluate_completion }
            claims:
              - kind: satisfies
                criterion: REQ-WORK-001#criterion.completion-evidence
          - id: lifecycle-proofs
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: symbol, name: target_lifecycle_proofs }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.receipt-validation

  - id: FEAT-CLI-001
    title: CLI orchestration
    summary: Orchestrate workspace, work, readiness, and validation commands.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: cli
        responsibility: Orchestrate canonical validation and work commands.
        targets:
          - id: cli-run
            adapter: rust
            path: src/lib.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.cli-orchestration

  - id: FEAT-LSP-001
    title: LSP
    summary: Serve canonical specification navigation and hover information.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: lsp
        responsibility: Serve canonical specification language-server state.
        targets:
          - id: lsp-server
            adapter: rust
            path: src/lsp/mod.rs
            selector: { kind: symbol, name: run_lsp_server }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.lsp-navigation }]

  - id: FEAT-DOCS-001
    title: Documentation generation
    summary: Generate a navigable documentation product from the canonical specification and its guides.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: documentation
        responsibility: Own the pre-v1 documentation tree as a product surface; replace obsolete information architecture outright without legacy routes or aliases.
        owns:
          - { id: retired-generated-delivery, adapter: declared, path: docs/generated/site-spec/delivery.md, selector: { kind: file } }
          - { id: retired-generated-public-entrypoints, adapter: declared, path: docs/generated/site-spec/public-entrypoints.md, selector: { kind: file } }
          - { id: retired-generated-work, adapter: declared, path: docs/generated/site-spec/work.md, selector: { kind: file } }
          - { id: retired-generated-workbench-features, adapter: declared, path: docs/generated/site-spec/workbench-features.md, selector: { kind: file } }
          - { id: legacy-guide-getting-started, adapter: declared, path: docs/guide/getting-started.md, selector: { kind: file } }
          - { id: legacy-generated-documentation-page, adapter: declared, path: docs/generated/site-spec/features/documentation/docs.md, selector: { kind: file } }
          - { id: legacy-generated-site-spec-index, adapter: declared, path: docs/generated/site-spec/index.md, selector: { kind: file } }
          - { id: documentation-contribute, adapter: declared, path: docs/contribute, selector: { kind: path-prefix, value: docs/contribute } }
          - { id: documentation-project, adapter: declared, path: docs/project, selector: { kind: path-prefix, value: docs/project } }
          - { id: documentation-reference, adapter: declared, path: docs/reference, selector: { kind: path-prefix, value: docs/reference } }
          - { id: documentation-start-here, adapter: declared, path: docs/start-here, selector: { kind: path-prefix, value: docs/start-here } }
          - { id: documentation-mitase, adapter: declared, path: docs/mitase, selector: { kind: path-prefix, value: docs/mitase } }
          - { id: documentation-understand, adapter: declared, path: docs/understand, selector: { kind: path-prefix, value: docs/understand } }
          - { id: documentation-workflows, adapter: declared, path: docs/workflows, selector: { kind: path-prefix, value: docs/workflows } }
          - { id: examples-go-only, adapter: declared, path: examples/go-only, selector: { kind: path-prefix, value: examples/go-only } }
          - { id: examples-polyglot, adapter: declared, path: examples/polyglot, selector: { kind: path-prefix, value: examples/polyglot } }
          - { id: examples-python-only, adapter: declared, path: examples/python-only, selector: { kind: path-prefix, value: examples/python-only } }
          - { id: examples-typescript-only, adapter: declared, path: examples/typescript-only, selector: { kind: path-prefix, value: examples/typescript-only } }
          - { id: valid-web-app-fixture, adapter: declared, path: fixtures/v1/valid-web-app/mitase.yaml, selector: { kind: file } }
          - { id: documentation-index, adapter: declared, path: docs/index.md, selector: { kind: file } }
          - { id: site-docs-generator, adapter: declared, path: scripts/generate-site-docs.py, selector: { kind: file } }
          - { id: site-docs-extras-generator, adapter: declared, path: scripts/generate-docs-site-extras.py, selector: { kind: file } }
          - { id: site-docs-freshness-check, adapter: declared, path: scripts/ci/check-generated-docs-freshness.sh, selector: { kind: file } }
          - { id: site-docs-coverage-check, adapter: declared, path: scripts/ci/coverage.sh, selector: { kind: file } }
          - { id: docs-site-configuration, adapter: declared, path: website/docusaurus.config.js, selector: { kind: file } }
          - { id: docs-site-sidebar, adapter: declared, path: website/sidebars.js, selector: { kind: file } }
          - { id: repository-readme, adapter: declared, path: README.md, selector: { kind: file } }
          - { id: vscode-readme, adapter: declared, path: editors/vscode/README.md, selector: { kind: file } }
          - { id: docs-site-homepage, adapter: javascript, path: website/src/pages/index.js, selector: { kind: module, name: "*" } }
          - { id: release-please-configuration, adapter: declared, path: release-please-config.json, selector: { kind: file } }
        targets:
          - id: generated-index
            adapter: declared
            path: docs/reference/specification/index.md
            selector: { kind: file }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.docs-generation }]
