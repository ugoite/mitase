schema: mitase/spec/v1
kind: features
namespace: capabilities
category: Mitase functional units
features:
  - id: FEAT-SPEC-MODEL-001
    title: Spec model
    summary: Parse and validate the canonical mitase/spec/v1 model, including explicit present and absent target lifecycle declarations.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: model
        owns:
          - id: spec-model-artifact-target
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: module, name: 'lib::ArtifactTarget' }
          - id: spec-model-present-lifecycle
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: module, name: 'lib::is_present_target_lifecycle' }
          - id: spec-model-tests-module
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: module, name: 'lib::tests[cfg(test)]' }
        responsibility: Provide the typed specification model.
        targets:
          - id: spec-document
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: symbol, name: SpecDocument }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.spec-model }]
          - id: digest-format
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: symbol, name: format_sha256 }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.digest-format }]
          - id: target-lifecycle
            adapter: rust
            path: crates/mitase-spec-model/src/lib.rs
            selector: { kind: symbol, name: ArtifactTargetLifecycle }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.spec-model }]

  - id: FEAT-PROJECT-CONFIG-001
    title: Project configuration
    summary: Load and validate mitase/config/v1 project configuration.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: configuration
        responsibility: Provide the typed project configuration model.
        owns:
          - id: project-config-change-baseline
            adapter: rust
            path: crates/mitase-project-model/src/lib.rs
            selector: { kind: module, name: 'lib::ChangeBaseline' }
          - id: project-config-changed
            adapter: rust
            path: crates/mitase-project-model/src/lib.rs
            selector: { kind: module, name: 'lib::ChangedConfig' }
          - id: project-config-readiness-limits
            adapter: rust
            path: crates/mitase-project-model/src/lib.rs
            selector: { kind: module, name: 'lib::ReadinessLimits' }
          - id: project-config-verification
            adapter: rust
            path: crates/mitase-project-model/src/lib.rs
            selector: { kind: module, name: 'lib::VerificationConfig' }
          - id: project-config-tests
            adapter: rust
            path: crates/mitase-project-model/src/lib.rs
            selector: { kind: module, name: 'tests[cfg(test)]' }
        targets:
          - id: project-config
            adapter: rust
            path: crates/mitase-project-model/src/lib.rs
            selector: { kind: symbol, name: ProjectConfig }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.project-config }]

  - id: FEAT-INVENTORY-001
    title: Inventory providers
    summary: Discover active artifact units through profile-selected providers.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: inventory
        responsibility: Discover provider-owned semantic artifact units.
        targets:
          - id: inventory-registry
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: symbol, name: InventoryRegistry }
            claims:
              - { kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.inventory-discovery }
              - { kind: satisfies, criterion: REQ-CAPABILITY-002#criterion.language-aware-inventory }
          - id: semantic-diff
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: symbol, name: semantic_diff }
            claims:
              - { kind: satisfies, criterion: REQ-CAPABILITY-002#criterion.stable-identity }
              - { kind: satisfies, criterion: REQ-CAPABILITY-002#criterion.semantic-diff }
        owns:
          - id: inventory-source
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: file }
          - id: inventory-discover-rust
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::discover_rust' }
          - id: inventory-html-marker-units
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::html_marker_units' }
          - id: inventory-markdown-headings
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::markdown_headings' }
          - id: inventory-openapi-operations
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::openapi_operations' }
          - id: inventory-schema-nodes
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::schema_nodes' }
          - id: inventory-source-symbol-units
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::source_symbol_units' }
          - id: inventory-support-unit
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::support_unit' }
          - id: inventory-unit
            adapter: rust
            path: crates/mitase-inventory/src/lib.rs
            selector: { kind: module, name: 'lib::unit' }
          - id: inventory-manifest
            adapter: declared
            path: crates/mitase-inventory/Cargo.toml
            selector: { kind: file }

  - id: FEAT-IDENTITY-001
    title: Exact artifact identity
    summary: Resolve one exact editable or observable artifact target per identity.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: identity
        responsibility: Resolve exact targets through the workspace.
        owns:
          - id: workspace-spec
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::SpecWorkspace' }
          - id: workspace-matcher
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::WorkspaceMatcher' }
          - id: workspace-collect-yaml
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::collect_yaml' }
          - id: workspace-find-root
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::find_root' }
          - id: workspace-matcher-build
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::impl(WorkspaceMatcher)::build' }
          - id: workspace-obsolete-config
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::is_obsolete_pre_release_config' }
          - id: workspace-obsolete-spec
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::is_obsolete_pre_release_spec' }
          - id: workspace-resolve-content
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::resolve_target_from_content' }
          - id: workspace-resolve-artifact
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::resolve_artifact_unit' }
          - id: workspace-target-test
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::tests::target' }
          - id: workspace-tests-module
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: module, name: 'lib::tests[cfg(test)]' }
        targets:
          - id: target-resolver
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: symbol, name: resolve_target_in_workspace }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.exact-identity

  - id: FEAT-INDEX-001
    title: Graph indexing
    summary: Index specifications, targets, claims, and contracts into one graph.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: index
        responsibility: Build the canonical specification and artifact index.
        targets:
          - id: spec-index
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: symbol, name: SpecIndex }
            claims:
              - { kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.graph-index }

  - id: FEAT-OWNERSHIP-001
    title: Ownership resolution
    summary: Resolve ownership scopes and target claims without path-only inference.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: ownership
        responsibility: Represent exact and scoped ownership references.
        targets:
          - id: ownership-ref
            adapter: rust
            path: crates/mitase-workspace/src/lib.rs
            selector: { kind: symbol, name: OwnershipRef }
            claims: [{ kind: satisfies, criterion: REQ-CAPABILITY-001#criterion.ownership-resolution }]

  - id: FEAT-READINESS-001
    title: Readiness validation
    summary: Evaluate traceable, seedable, and verifiable readiness.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: readiness
        responsibility: Evaluate readiness subjects and verification closure.
        owns:
          - id: readiness-source
            adapter: rust
            path: crates/mitase-validation/src/readiness.rs
            selector: { kind: file }
          - id: readiness-implementation-obligations
            adapter: rust
            path: crates/mitase-validation/src/readiness.rs
            selector: { kind: module, name: 'readiness::implementation_obligations' }
          - id: readiness-implemented-subjects
            adapter: rust
            path: crates/mitase-validation/src/readiness.rs
            selector: { kind: module, name: 'readiness::implemented_feature_subjects' }
        targets:
          - id: readiness-evaluate
            adapter: rust
            path: crates/mitase-validation/src/readiness.rs
            selector: { kind: symbol, name: evaluate }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.readiness-ladder

  - id: FEAT-CHANGE-VALIDATION-001
    title: Change validation
    summary: Validate changed artifacts against the canonical workspace and ownership.
    status: implemented
    bindings:
      - id: implementation
        role: implementation
        facet: validation
        responsibility: Validate semantic changed units against ownership and semantic impact.
        owns:
          - id: validation-source
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: file }
          - id: validation-init-git-repo
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::init_git_repo' }
          - id: validation-deleted-anchor-test
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::changed_anchors_include_deleted_baseline_anchor_by_repo_path' }
          - id: validation-self-verify-test
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::implemented_feature_target_cannot_self_verify' }
          - id: validation-acceptance-test
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::implemented_feature_target_requires_acceptance' }
          - id: validation-exact-verification-test
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::implemented_feature_target_requires_exact_verification' }
          - id: validation-public-symbol-test
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::language_public_symbol_without_an_exposes_claim_is_not_a_public_contract_subject' }
          - id: validation-planned-ownership-test
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests::planned_feature_ownership_is_rejected' }
          - id: validation-tests-module
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::tests[cfg(test)]' }
          - id: validation-validate-changes
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::validate_changes' }
          - id: validation-document-shapes
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::validate_document_shapes' }
          - id: validation-targets
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: module, name: 'lib::validate_targets' }
        targets:
          - id: change-validate
            adapter: rust
            path: crates/mitase-validation/src/lib.rs
            selector: { kind: symbol, name: validate }
            claims:
              - kind: satisfies
                criterion: REQ-CAPABILITY-001#criterion.change-validation
