[workspace]
members = [
  ".",
  "crates/syu-spec-model",
  "crates/syu-project-model",
  "crates/syu-work-model",
  "crates/syu-diagnostics",
  "crates/syu-workspace",
  "crates/syu-validation",
  "crates/syu-planner",
  "crates/syu-workbench-server",
  "crates/syu-app-ui",
  "crates/syu-code-intel",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"

[package]
name = "syu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
description = "Specification-driven work planning and validation"

[dependencies]
anyhow.workspace = true
clap.workspace = true
regex = "1.12.2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
url = "2.5.7"
syu-diagnostics = { path = "crates/syu-diagnostics" }
syu-code-intel = { path = "crates/syu-code-intel" }
syu-planner = { path = "crates/syu-planner" }
syu-project-model = { path = "crates/syu-project-model" }
syu-spec-model = { path = "crates/syu-spec-model" }
syu-validation = { path = "crates/syu-validation" }
syu-work-model = { path = "crates/syu-work-model" }
syu-workbench-server = { path = "crates/syu-workbench-server" }
syu-workspace = { path = "crates/syu-workspace" }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true
