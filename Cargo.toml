[workspace]
members = [
  ".",
  "crates/mitase-spec-model",
  "crates/mitase-project-model",
  "crates/mitase-work-model",
  "crates/mitase-diagnostics",
  "crates/mitase-workspace",
  "crates/mitase-inventory",
  "crates/mitase-validation",
  "crates/mitase-planner",
  "crates/mitase-code-intel",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
quote = "1.0.46"
tempfile = "3.23.0"
tree-sitter = "0.26.9"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"

[package]
name = "mitase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
description = "Specification-driven validation"

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
clap.workspace = true
regex = "1.12.2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
uuid.workspace = true
url = "2.5.7"
mitase-diagnostics = { path = "crates/mitase-diagnostics" }
mitase-inventory = { path = "crates/mitase-inventory" }
mitase-code-intel = { path = "crates/mitase-code-intel" }
mitase-project-model = { path = "crates/mitase-project-model" }
mitase-spec-model = { path = "crates/mitase-spec-model" }
mitase-validation = { path = "crates/mitase-validation" }
mitase-workspace = { path = "crates/mitase-workspace" }
tempfile.workspace = true
tokio = { version = "1.52.3", features = ["io-util", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[build-dependencies]
serde_json.workspace = true
