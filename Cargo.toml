[workspace]
members = [
    ".",
    "crates/syu-actions",
    "crates/syu-code-intel",
    "crates/syu-app-ui",
    "crates/syu-domain",
    "crates/syu-workbench-server",
    "crates/syu-workbench",
    "crates/syu-task-model",
]

[package]
name = "syu"
version = "0.0.1-alpha.8"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
description = "Specification-driven development helper CLI"
license = "MIT"
readme = "README.md"
keywords = ["cli", "specification", "yaml", "testing", "traceability"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
globset = "0.4.15"
include_dir = "0.7.4"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
syu-domain = { path = "crates/syu-domain" }
syu-code-intel = { path = "crates/syu-code-intel" }
syu-task-model = { path = "crates/syu-task-model" }
syu-core = { path = "crates/syu-core" }
syu-workbench-server = { path = "crates/syu-workbench-server" }
syn = { version = "2.0.117", features = ["full"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
tree-sitter = "0.26.9"
tree-sitter-typescript = "0.23.2"
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.2.2"
dioxus = { version = "0.7.9", features = ["asset", "html", "macro"] }
dioxus-ssr = "0.7.9"
libc = "0.2.186"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
syu-app-ui = { path = "crates/syu-app-ui" }
syu-workbench = { path = "crates/syu-workbench" }

[build-dependencies]
serde_json = "1.0.150"
