[workspace]
members = [
  ".",
  "crates/syu-spec-model",
  "crates/syu-project-model",
  "crates/syu-work-model",
  "crates/syu-diagnostics",
  "crates/syu-workspace",
  "crates/syu-inventory",
  "crates/syu-validation",
  "crates/syu-delivery",
  "crates/syu-agent",
  "crates/syu-planner",
  "crates/syu-workbench-server",
  "crates/syu-app-ui",
  "crates/syu-code-intel",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
quote = "1.0.46"
tempfile = "3.23.0"

[package]
name = "syu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
description = "Specification-driven work planning and validation"

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
clap.workspace = true
regex = "1.12.2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
uuid.workspace = true
url = "2.5.7"
syu-diagnostics = { path = "crates/syu-diagnostics" }
syu-delivery = { path = "crates/syu-delivery" }
syu-inventory = { path = "crates/syu-inventory" }
syu-app-ui = { path = "crates/syu-app-ui" }
syu-code-intel = { path = "crates/syu-code-intel" }
syu-planner = { path = "crates/syu-planner" }
syu-project-model = { path = "crates/syu-project-model" }
syu-spec-model = { path = "crates/syu-spec-model" }
syu-validation = { path = "crates/syu-validation" }
syu-work-model = { path = "crates/syu-work-model" }
syu-workbench-server = { path = "crates/syu-workbench-server" }
syu-workspace = { path = "crates/syu-workspace" }
tempfile.workspace = true
tokio = { version = "1.52.3", features = ["io-util", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[build-dependencies]
serde_json.workspace = true
