# FEAT-DOCS-002 FEAT-QUALITY-001
name: Build docs site
description: Install dependencies and build the checked-in Docusaurus site

runs:
  using: composite
  steps:
    - name: Install the repository toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true

    - name: Install docs-site dependencies
      shell: bash
      run: mise run setup:website

    - name: Build documentation site
      shell: bash
      run: mise run build:website
