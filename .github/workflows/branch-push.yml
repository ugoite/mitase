# FEAT-QUALITY-001
name: branch-push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: branch-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  duplicate-check:
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect open pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq 'length')" != "0" ]]; then
            echo "has_open_pr=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_open_pr=false" >>"$GITHUB_OUTPUT"
          fi

  file-hygiene:
    needs: duplicate-check
    if: needs.duplicate-check.outputs.has_open_pr == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python with pip cache
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run file hygiene hooks
        shell: bash
        run: |
          hooks=(
            trailing-whitespace
            end-of-file-fixer
            check-yaml
            check-json
            check-toml
            mixed-line-ending
            check-merge-conflict
            shellcheck
          )

          for hook in "${hooks[@]}"; do
            pre-commit run --all-files "$hook"
          done

  quality-fast:
    needs: duplicate-check
    if: needs.duplicate-check.outputs.has_open_pr == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust for fast quality gates
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy

      - name: Run fast quality gates
        env:
          PRE_COMMIT_FROM_REF: ${{ github.event.before }}
          PRE_COMMIT_TO_REF: ${{ github.sha }}
        run: scripts/ci/quality-gates.sh fast
