# FEAT-QUALITY-001
#
# Transitional manual alias. Pull requests and main pushes use ci.yml, whose
# Mise-backed lanes are the canonical hosted validation surface.
name: branch-push

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  canonical-fast-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - run: mise run ci:lane:rust-check
      - run: mise run ci:lane:repo
