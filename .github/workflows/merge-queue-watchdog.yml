# FEAT-QUALITY-001
name: merge-queue-watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check merge queue health
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-merge-queue-health.sh
