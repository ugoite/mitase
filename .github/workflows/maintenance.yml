# FEAT-QUALITY-001
name: maintenance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        uses: taiki-e/cache-cargo-install-action@v3.0.8
        with:
          tool: cargo-audit

      - name: Run dependency audit
        run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js (docs site)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Align npm with website/package.json
        shell: bash
        run: scripts/ci/pinned-npm.sh install website

      - name: Audit docs site dependencies
        working-directory: website
        run: npm audit --omit=dev --audit-level=high
