# FEAT-QUALITY-001
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: ci-rust-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - name: Install Rust CI components
        run: rustup component add rustfmt clippy

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=mitase-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >>"$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"
          fi

      - name: Run Rust check lane
        run: mise run ci:lane:rust-check

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  rust-test:
    name: ci-rust-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: "false"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=mitase-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"

      - name: Run Rust test lane
        run: mise run ci:lane:rust-test

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  repo:
    name: ci-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: "false"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=mitase-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"

      - name: Run repository lane
        run: mise run ci:lane:repo

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - rust-check
      - rust-test
      - repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all CI lanes
        env:
          RUST_CHECK_RESULT: ${{ needs.rust-check.result }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          REPO_RESULT: ${{ needs.repo.result }}
        run: |
          test "$RUST_CHECK_RESULT" = success
          test "$RUST_TEST_RESULT" = success
          test "$REPO_RESULT" = success
