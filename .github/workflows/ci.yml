# FEAT-QUALITY-001
name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python with pip cache
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run file hygiene hooks
        shell: bash
        run: |
          hooks=(
            trailing-whitespace
            end-of-file-fixer
            check-yaml
            check-json
            check-toml
            mixed-line-ending
            check-merge-conflict
            shellcheck
          )

          for hook in "${hooks[@]}"; do
            pre-commit run --all-files "$hook"
          done

  quality-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust for fast quality gates
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy

      - name: Run fast quality gates
        run: scripts/ci/quality-gates.sh fast

  quality-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust for quality gates
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy

      - name: Run full quality gates
        run: scripts/ci/quality-gates.sh full

  goal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Run v1 planner and validation tests
        run: cargo test --workspace

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust for Workbench gates
        uses: ./.github/actions/setup-rust

      - name: Install scoped Tailwind CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tailwind" tailwindcss @tailwindcss/cli
          ln -s "$RUNNER_TEMP/tailwind/node_modules" "$GITHUB_WORKSPACE/crates/syu-app-ui/node_modules"
          echo "$RUNNER_TEMP/tailwind/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Expose Tailwind CLI to Workbench checks
        run: echo "TAILWINDCSS_BIN=tailwindcss" >>"$GITHUB_ENV"

      - name: Run canonical Workbench projection gates
        run: cargo check -p syu-workbench-server -p syu-app-ui

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.12

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check dependency graph support
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=dependency-review skipped::Enable Dependency graph in repository settings to activate dependency review."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5

  spec-linkage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Require issue or spec IDs for self-spec changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-pr-spec-links.sh

  squash-history-spec-ids:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Require spec IDs in squash commit titles
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-squash-title-spec-ids.sh

  installer-smoke:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Run installer smoke tests
        shell: bash
        run: scripts/ci/installer-smoke.sh

  installed-binary-smoke:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Run installed-binary smoke test
        shell: bash
        run: scripts/ci/installed-binary-smoke.sh

  docs-site:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build checked-in docs site
        uses: ./.github/actions/build-docs-site

  check-msrv:
    name: MSRV check (1.88)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check all targets on MSRV
        run: cargo check --all-targets

  ci-required:
    name: ci-required
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - file-hygiene
      - quality-fast
      - quality-full
      - goal-tests
      - workbench
      - actionlint
      - dependency-review
      - spec-linkage
      - squash-history-spec-ids
      - installer-smoke
      - installed-binary-smoke
      - docs-site
      - check-msrv
    steps:
      - name: Fail if a required dependency failed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] in ("failure", "cancelled")
          }

          if failed:
              print("Required jobs failed or were cancelled:")
              for name, result in failed.items():
                  print(f"- {name}: {result}")
              sys.exit(1)

          print("ci-required passed")
          PY
