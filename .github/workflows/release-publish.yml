name: release-publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Workflow run ID that produced the immutable candidate bundle
        required: true
        type: string
      candidate_id:
        description: Candidate ID recorded in the candidate manifest
        required: true
        type: string

concurrency:
  group: release-publish-${{ inputs.candidate_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mitase-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: target/release-candidate

      - name: Verify candidate identity and exact artifact bytes
        id: verify
        env:
          INPUT_CANDIDATE_ID: ${{ inputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="$(find target/release-candidate -type f -name candidate-manifest.json -print -quit)"
          if [[ -z "$manifest_path" ]]; then
            echo "candidate manifest is missing from the downloaded bundle" >&2
            exit 1
          fi
          bundle_root="$(dirname "$manifest_path")"
          artifact_root="$bundle_root/artifacts"

          (cd "$bundle_root" && sha256sum -c candidate-manifest.json.sha256)
          python3 scripts/ci/release_candidate.py validate \
            --manifest "$manifest_path" \
            --candidate-id "$INPUT_CANDIDATE_ID" \
            --artifact-root "$artifact_root"

          source_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha"])' "$manifest_path")"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest_path")"
          git cat-file -e "${source_sha}^{commit}"
          {
            echo "manifest_path=$manifest_path"
            echo "bundle_root=$bundle_root"
            echo "artifact_root=$artifact_root"
            echo "source_sha=$source_sha"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Mitase candidate verified"
            echo "- version: `$version`"
            echo "- source SHA: `$source_sha`"
            echo "- candidate ID: `$INPUT_CANDIDATE_ID`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.version }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          BUNDLE_ROOT: ${{ steps.verify.outputs.bundle_root }}
          ARTIFACT_ROOT: ${{ steps.verify.outputs.artifact_root }}
        shell: bash
        run: |
          set -euo pipefail
          release_assets=("$BUNDLE_ROOT/candidate-manifest.json" "$BUNDLE_ROOT/candidate-manifest.json.sha256")
          while IFS= read -r artifact; do
            release_assets+=("$artifact")
          done < <(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -print | sort)

          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --title "Mitase ${RELEASE_TAG}" \
            --generate-notes \
            "${release_assets[@]}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish exact package archives
        env:
          ORAS_USER: ${{ github.actor }}
          ORAS_PASSWORD: ${{ github.token }}
          PACKAGE_REGISTRY: ghcr.io
          PACKAGE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.verify.outputs.version }}
          ARTIFACT_ROOT: ${{ steps.verify.outputs.artifact_root }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ORAS_PASSWORD" | oras login "$PACKAGE_REGISTRY" --username "$ORAS_USER" --password-stdin
          while IFS= read -r archive; do
            filename="$(basename "$archive")"
            case "$filename" in
              mitase-*.tar.gz)
                target="${filename#mitase-}"
                target="${target%.tar.gz}"
                ;;
              mitase-*.zip)
                target="${filename#mitase-}"
                target="${target%.zip}"
                ;;
              *)
                continue
                ;;
            esac
            scripts/ci/publish-package.sh \
              "$PACKAGE_REGISTRY" \
              "$PACKAGE_REPOSITORY" \
              "${RELEASE_TAG}__${target}" \
              "$archive"
          done < <(find "$ARTIFACT_ROOT" -maxdepth 1 -type f \( -name 'mitase-*.tar.gz' -o -name 'mitase-*.zip' \) -print | sort)
