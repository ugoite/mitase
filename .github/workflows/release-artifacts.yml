# FEAT-RELEASE-001
name: release-artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release source
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta)\.[0-9]+))?$ ]]; then
            echo "release tag must be v<SemVer> with optional alpha or beta prerelease: ${RELEASE_TAG}" >&2
            exit 1
          fi

          release_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          if [[ -z "$release_sha" ]]; then
            echo "release tag does not resolve to a commit: ${RELEASE_TAG}" >&2
            exit 1
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_sha=${release_sha}"
          } >>"$GITHUB_OUTPUT"

  release-notes:
    needs:
      - prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Generate track-specific release notes
        shell: bash
        run: scripts/ci/release-track-notes.sh "${RELEASE_TAG}"

  release-artifacts:
    needs:
      - prepare
      - release-notes
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mitase
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            binary: mitase
            cross_compile: true
            linker: aarch64-linux-gnu-gcc
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: mitase
          - os: macos-14
            target: aarch64-apple-darwin
            binary: mitase
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mitase.exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      MITASE_BUILD_VERSION: ${{ needs.prepare.outputs.release_tag }}
      PACKAGE_REGISTRY: ghcr.io
      PACKAGE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cross-compilation toolchain (aarch64-linux-gnu)
        if: matrix.cross_compile == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build release binary (cross-compile aarch64 linux)
        if: matrix.cross_compile == true
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify Linux glibc compatibility baseline
        if: matrix.cross_compile == true
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          required_glibc="$(readelf --version-info "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -V | tail -1)"
          baseline_glibc="GLIBC_2.36"

          if [[ -z "$required_glibc" ]]; then
            echo "Failed to determine the GLIBC baseline for $binary" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n%s\n' "$baseline_glibc" "$required_glibc" | sort -V | tail -1)" != "$baseline_glibc" ]]; then
            echo "aarch64 release binary requires $required_glibc, which is newer than Debian 12's $baseline_glibc" >&2
            exit 1
          fi

      - name: Build release binary
        if: matrix.cross_compile != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release artifacts
        shell: bash
        run: |
          scripts/ci/package-release.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            release-artifacts

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish package artifacts
        shell: bash
        env:
          ORAS_USER: ${{ github.actor }}
          ORAS_PASSWORD: ${{ github.token }}
        run: |
          archive_name="mitase-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *windows*) archive_name="${archive_name}.zip" ;;
            *) archive_name="${archive_name}.tar.gz" ;;
          esac
          echo "$ORAS_PASSWORD" | oras login "$PACKAGE_REGISTRY" --username "$ORAS_USER" --password-stdin
          scripts/ci/publish-package.sh \
            "$PACKAGE_REGISTRY" \
            "$PACKAGE_REPOSITORY" \
            "${RELEASE_TAG}__${{ matrix.target }}" \
            "release-artifacts/${archive_name}"

      - name: Include release installer
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('scripts/install-mitase.sh').read_text(encoding='utf-8')
          rendered = source.replace('__MITASE_RELEASE_TAG__', '${{ env.RELEASE_TAG }}')
          Path('release-artifacts/install-mitase.sh').write_text(rendered, encoding='utf-8')
          PY

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./* > checksums.sha256
          else
            shasum -a 256 ./* > checksums.sha256
          fi

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-artifacts/*
