name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  v1-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -- validate workspace .
      - name: Prove closed-loop readiness
        run: |
          cargo run -- readiness report . --format json > readiness.json
          python3 - <<'PY'
          import json
          report = json.load(open("readiness.json"))
          for axis in ("inventory", "ownership", "seedability", "workability", "verification", "closed_loop"):
              value = report[axis]
              assert value["required"] == value["ready"], (axis, value)
          PY
