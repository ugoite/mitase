name: quality
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  v1-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
      - run: scripts/ci/quality-gates.sh full
