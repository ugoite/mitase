# FEAT-QUALITY-001
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^app/dist/
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mitase-validate-changed
        name: mitase-validate-changed
        entry: scripts/dev/validate-changed.sh
        language: system
        pass_filenames: true
        files: ^(mitase\.yaml|docs/mitase/)
        stages: [pre-commit]
      - id: mitase-rustfmt
        name: mitase-rustfmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-commit]
      - id: mitase-quality-gates
        name: mitase-quality-gates
        entry: scripts/ci/quality-gates.sh fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
