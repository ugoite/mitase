# FEAT-QUALITY-001
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^app/dist/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: local
    hooks:
      - id: syu-validate-changed
        name: syu-validate-changed
        entry: scripts/dev/validate-changed.sh
        language: system
        pass_filenames: true
        files: ^(syu\.yaml|docs/syu/|crates/|src/|tests/|app/|website/)
        stages:
          - pre-commit
          - manual
      - id: syu-quality-gates
        name: syu-quality-gates
        entry: scripts/ci/quality-gates.sh fast
        language: system
        pass_filenames: false
        stages:
          - pre-push
          - manual
